<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>The consistency map, and when extra steps help</title>
  <desc>Left: every point on one probability-flow trajectory maps to the same endpoint, which is the self-consistency property — but a constant function satisfies it exactly, so the boundary condition is what makes the objective non-trivial. Right: extra sampling steps reduce error by sevenfold when the model's error is a systematic bias that grows with noise level, and slightly increase it when the error is independent noise.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="330" y1="40" x2="330" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">One trajectory, one endpoint</text>

  <path d="M40 92 C 110 66, 180 128, 288 108" fill="none" stroke="#484f58" stroke-width="2"/>
  <circle cx="40" cy="92" r="4" fill="#8b949e"/><text x="40" y="80" fill="#8b949e" font-size="9" text-anchor="middle">σ = 20</text>
  <circle cx="140" cy="86" r="4" fill="#8b949e"/><text x="140" y="74" fill="#8b949e" font-size="9" text-anchor="middle">σ = 8</text>
  <circle cx="222" cy="116" r="4" fill="#8b949e"/><text x="222" y="136" fill="#8b949e" font-size="9" text-anchor="middle">σ = 2</text>
  <circle cx="288" cy="108" r="5" fill="#3fb950"/><text x="292" y="98" fill="#3fb950" font-size="9">x₀</text>

  <path d="M40 96 Q 150 176, 282 114" fill="none" stroke="#6c63ff" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#p)"/>
  <path d="M140 92 Q 200 158, 282 112" fill="none" stroke="#6c63ff" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#p)"/>
  <path d="M222 122 Q 250 142, 282 118" fill="none" stroke="#6c63ff" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#p)"/>
  <text x="60" y="168" fill="#6c63ff" font-size="9.5">f(x, σ) = x₀ for every σ on the path</text>

  <rect x="20" y="196" width="292" height="76" rx="5" fill="#1c2128" stroke="#f85149"/>
  <text x="32" y="216" fill="#f85149" font-size="10" font-weight="600">…which is why the boundary condition matters</text>
  <text x="32" y="234" fill="#8b949e" font-size="9">self-consistency residual</text>
  <text x="32" y="250" fill="#e6edf3" font-size="9">exact f: 0.00033</text>
  <text x="32" y="264" fill="#e6edf3" font-size="9">constant f ≡ 0: 0.00000  ← satisfies it perfectly</text>
  <text x="196" y="250" fill="#8b949e" font-size="9">sample W₁</text>
  <text x="196" y="264" fill="#f85149" font-size="9">2.00 vs 0.007</text>

  <text x="350" y="24" fill="#e6edf3" font-size="12" font-weight="600">When extra steps help</text>
  <text x="350" y="40" fill="#8b949e" font-size="9.5">W₁ error against number of sampling steps</text>
  <line x1="380" y1="252" x2="620" y2="252" stroke="#30363d"/>
  <line x1="380" y1="72" x2="380" y2="252" stroke="#30363d"/>
  <text x="374" y="88" fill="#8b949e" font-size="8.5" text-anchor="end">1</text>
  <text x="374" y="168" fill="#8b949e" font-size="8.5" text-anchor="end">0.1</text>
  <text x="374" y="240" fill="#8b949e" font-size="8.5" text-anchor="end">0.02</text>

  <polyline points="400,101 490,146 580,172" fill="none" stroke="#3fb950" stroke-width="2"/>
  <circle cx="400" cy="101" r="3.5" fill="#3fb950"/><circle cx="490" cy="146" r="3.5" fill="#3fb950"/><circle cx="580" cy="172" r="3.5" fill="#3fb950"/>
  <text x="470" y="112" fill="#3fb950" font-size="9">bias that grows with σ</text>
  <text x="470" y="124" fill="#3fb950" font-size="9">7.7× better by 3 steps</text>

  <polyline points="400,233 490,228 580,225" fill="none" stroke="#f85149" stroke-width="2"/>
  <circle cx="400" cy="233" r="3.5" fill="#f85149"/><circle cx="490" cy="228" r="3.5" fill="#f85149"/><circle cx="580" cy="225" r="3.5" fill="#f85149"/>
  <text x="404" y="248" fill="#f85149" font-size="9">independent noise — slightly worse</text>

  <text x="400" y="268" fill="#8b949e" font-size="9" text-anchor="middle">1</text>
  <text x="490" y="268" fill="#8b949e" font-size="9" text-anchor="middle">2</text>
  <text x="580" y="268" fill="#8b949e" font-size="9" text-anchor="middle">3</text>
  <text x="500" y="284" fill="#8b949e" font-size="9.5" text-anchor="middle">sampling steps</text>

  <defs><marker id="p" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6c63ff"/></marker></defs>
</svg>
