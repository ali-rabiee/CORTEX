<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="mgt mgd" font-family="system-ui, -apple-system, sans-serif">
  <title id="mgt">Conflicting task gradients, and PCGrad's projection</title>
  <desc id="mgd">On the left, two task gradients point more than ninety degrees
    apart, so their sum is shorter than either and makes little progress on
    task A. On the right, PCGrad removes from task A's gradient the component
    that points against task B, leaving a direction that no longer opposes B
    while keeping the rest of A's descent direction.</desc>

  <defs>
    <marker id="mgA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/></marker>
    <marker id="mgB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker>
    <marker id="mgS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker>
    <marker id="mgP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  </defs>

  <!-- ===== left: the conflict ===== -->
  <text x="20" y="28" fill="#f85149" font-size="13" font-weight="600">Naive sum</text>
  <text x="20" y="46" fill="#8b949e" font-size="11">cos(g&#7511;, g&#7517;) &#60; 0</text>

  <circle cx="160" cy="200" r="3.5" fill="#8b949e"/>
  <text x="160" y="222" fill="#8b949e" font-size="10.5" text-anchor="middle">&#952;</text>

  <line x1="160" y1="200" x2="220" y2="100" stroke="#6c63ff" stroke-width="2.4" marker-end="url(#mgA)"/>
  <text x="234" y="96" fill="#6c63ff" font-size="11.5">g&#7511;</text>

  <line x1="160" y1="200" x2="60" y2="180" stroke="#d29922" stroke-width="2.4" marker-end="url(#mgB)"/>
  <text x="44" y="174" fill="#d29922" font-size="11.5">g&#7517;</text>

  <line x1="160" y1="200" x2="120" y2="80" stroke="#f85149" stroke-width="2.8"
        stroke-dasharray="6 4" marker-end="url(#mgS)"/>
  <text x="96" y="72" fill="#f85149" font-size="11.5">g&#7511; + g&#7517;</text>

  <text x="160" y="256" fill="#f85149" font-size="11" text-anchor="middle">shorter than either;</text>
  <text x="160" y="272" fill="#f85149" font-size="11" text-anchor="middle">A&#8217;s own direction is largely cancelled</text>

  <line x1="320" y1="20" x2="320" y2="280" stroke="#30363d" stroke-width="1"/>

  <!-- ===== right: PCGrad ===== -->
  <text x="342" y="28" fill="#3fb950" font-size="13" font-weight="600">PCGrad projection</text>
  <text x="342" y="46" fill="#8b949e" font-size="11">g&#7511; &#8592; g&#7511; &#8722; (g&#7511;&#183;g&#7517; / &#8214;g&#7517;&#8214;&#178;) g&#7517;</text>

  <circle cx="470" cy="200" r="3.5" fill="#8b949e"/>

  <line x1="470" y1="200" x2="530" y2="100" stroke="#6c63ff" stroke-width="1.6"
        opacity="0.4" stroke-dasharray="4 4" marker-end="url(#mgA)"/>
  <text x="544" y="96" fill="#6c63ff" font-size="10.5" opacity="0.6">g&#7511;</text>

  <line x1="470" y1="200" x2="370" y2="180" stroke="#d29922" stroke-width="2.4" marker-end="url(#mgB)"/>
  <text x="354" y="174" fill="#d29922" font-size="11.5">g&#7517;</text>

  <line x1="470" y1="200" x2="491" y2="92" stroke="#3fb950" stroke-width="2.8" marker-end="url(#mgP)"/>
  <text x="500" y="76" fill="#3fb950" font-size="11.5">g&#7511;&#8869;</text>

  <line x1="530" y1="100" x2="491" y2="92" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="470" y="256" fill="#3fb950" font-size="11" text-anchor="middle">the component opposing B is removed;</text>
  <text x="470" y="272" fill="#3fb950" font-size="11" text-anchor="middle">the rest of A&#8217;s descent direction survives</text>
</svg>
