<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="avt avd" font-family="system-ui, -apple-system, sans-serif">
  <title id="avt">Where policy-gradient variance comes from, and which fix removes which part</title>
  <desc id="avd">Four bars showing the variance of the gradient weight under
    successive estimators. Weighting by the full episode return carries noise
    from rewards before the action, from the state's own value, and from every
    random transition after it. Using the return-to-go removes the first,
    subtracting a baseline removes the second, and bootstrapping through a value
    function truncates the third. Each technique targets a different term rather
    than shrinking the same one.</desc>

  <text x="24" y="26" fill="#e6edf3" font-size="12">variance of the gradient weight, by estimator</text>

  <!-- legend -->
  <g font-size="9.5">
    <rect x="24" y="38" width="12" height="10" fill="#f85149" opacity="0.75"/>
    <text x="42" y="47" fill="#8b949e">rewards before the action</text>
    <rect x="196" y="38" width="12" height="10" fill="#d29922" opacity="0.75"/>
    <text x="214" y="47" fill="#8b949e">state value offset</text>
    <rect x="336" y="38" width="12" height="10" fill="#6c63ff" opacity="0.75"/>
    <text x="354" y="47" fill="#8b949e">future transitions and rewards</text>
    <rect x="536" y="38" width="12" height="10" fill="#3fb950" opacity="0.75"/>
    <text x="554" y="47" fill="#8b949e">action noise</text>
  </g>

  <!-- bars: x from 150, width scaled -->
  <g font-size="10.5" fill="#8b949e" text-anchor="end">
    <text x="142" y="82">G(&#964;)  &#8212; full return</text>
    <text x="142" y="122">G&#8348;  &#8212; return-to-go</text>
    <text x="142" y="162">G&#8348; &#8722; V(s&#8348;)</text>
    <text x="142" y="202">GAE(&#955;)</text>
  </g>

  <!-- row 1 -->
  <rect x="150" y="70" width="112" height="18" fill="#f85149" opacity="0.75"/>
  <rect x="262" y="70" width="126" height="18" fill="#d29922" opacity="0.75"/>
  <rect x="388" y="70" width="182" height="18" fill="#6c63ff" opacity="0.75"/>
  <rect x="570" y="70" width="30" height="18" fill="#3fb950" opacity="0.75"/>

  <!-- row 2: causality removes the red -->
  <rect x="150" y="110" width="126" height="18" fill="#d29922" opacity="0.75"/>
  <rect x="276" y="110" width="182" height="18" fill="#6c63ff" opacity="0.75"/>
  <rect x="458" y="110" width="30" height="18" fill="#3fb950" opacity="0.75"/>
  <text x="500" y="124" fill="#8b949e" font-size="9.5">causality: no bias</text>

  <!-- row 3: baseline removes the amber -->
  <rect x="150" y="150" width="182" height="18" fill="#6c63ff" opacity="0.75"/>
  <rect x="332" y="150" width="30" height="18" fill="#3fb950" opacity="0.75"/>
  <text x="374" y="164" fill="#8b949e" font-size="9.5">baseline: no bias (state-dependent only)</text>

  <!-- row 4: bootstrapping truncates the indigo -->
  <rect x="150" y="190" width="66" height="18" fill="#6c63ff" opacity="0.75"/>
  <rect x="216" y="190" width="30" height="18" fill="#3fb950" opacity="0.75"/>
  <text x="258" y="204" fill="#d29922" font-size="9.5">&#955; &#60; 1 truncates the tail &#8212; and buys bias for it</text>

  <line x1="24" y1="228" x2="616" y2="228" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="250" fill="#e6edf3" font-size="11">Each technique targets a different term. Stacking them is not redundant &#8212; and only the last one costs bias.</text>
  <text x="24" y="270" fill="#8b949e" font-size="10.5">The green term is irreducible for a stochastic policy: it is the estimator sampling the actions it is trying to score.</text>
  <text x="24" y="288" fill="#8b949e" font-size="10.5">Per-batch normalisation shrinks nothing here &#8212; it rescales the whole bar, which is a different problem with a different cost.</text>
</svg>
