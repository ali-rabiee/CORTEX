<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="t d" font-family="system-ui, -apple-system, sans-serif">
  <title id="t">The DAgger loop</title>
  <desc id="d">Train the policy on the dataset, roll it out, have the expert label
    the states the policy actually visited, aggregate those labels into the
    dataset, and repeat.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/>
    </marker>
  </defs>

  <g stroke="#6c63ff" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 210 62 L 372 62"/>
    <path d="M 470 96 L 470 150"/>
    <path d="M 430 236 L 268 236"/>
    <path d="M 170 202 L 170 148"/>
  </g>

  <g fill="#1c2128" stroke="#30363d" stroke-width="1.5">
    <rect x="58" y="36" width="152" height="52" rx="10"/>
    <rect x="372" y="36" width="196" height="52" rx="10"/>
    <rect x="372" y="150" width="196" height="66" rx="10"/>
    <rect x="58" y="150" width="210" height="66" rx="10"/>
  </g>

  <g fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">
    <text x="134" y="67">1 · Train π on D</text>
    <text x="470" y="67">2 · Roll out π on the task</text>
  </g>
  <g fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">
    <text x="470" y="177">3 · Expert labels those</text>
    <text x="470" y="196">states</text>
    <text x="163" y="177">4 · Aggregate</text>
  </g>
  <text x="163" y="197" fill="#8b949e" font-size="12.5" text-anchor="middle">D ← D ∪ new labels</text>

  <text x="470" y="120" fill="#8b949e" font-size="12" text-anchor="middle">visits its own states</text>
  <text x="320" y="262" fill="#8b949e" font-size="12" text-anchor="middle">"what would you have done here?"</text>

  <text x="320" y="288" fill="#3fb950" font-size="12.5" text-anchor="middle">
    training distribution now matches test distribution → regret O(εT)
  </text>
</svg>
