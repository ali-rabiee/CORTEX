<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="amt amd" font-family="system-ui, -apple-system, sans-serif">
  <title id="amt">Attention is memory-bound long before it is compute-bound</title>
  <desc id="amd">For a model of width 4096, attention's floating-point cost stays
    far below the feed-forward block's until the sequence reaches about 32,000
    tokens. The materialised attention matrix, however, grows to 32 gibibytes per
    layer at a sequence of 8192 with batch 8 and 32 heads. So the binding
    constraint at ordinary sequence lengths is memory traffic, not arithmetic,
    which is what FlashAttention addresses.</desc>

  <!-- FLOPs panel -->
  <text x="24" y="26" fill="#e6edf3" font-size="12">attention FLOPs as a fraction of the feed-forward block  (d = 4096)</text>

  <line x1="60" y1="140" x2="300" y2="140" stroke="#484f58" stroke-width="1.2"/>
  <line x1="60" y1="140" x2="60" y2="46" stroke="#484f58" stroke-width="1.2"/>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="60"  y="156">512</text>
    <text x="140" y="156">2k</text>
    <text x="220" y="156">8k</text>
    <text x="300" y="156">32k</text>
  </g>
  <text x="180" y="174" fill="#8b949e" font-size="10" text-anchor="middle">sequence length</text>
  <line x1="56" y1="46" x2="64" y2="46" stroke="#484f58"/>
  <text x="50" y="50" fill="#8b949e" font-size="9.5" text-anchor="end">1.0</text>
  <text x="50" y="144" fill="#8b949e" font-size="9.5" text-anchor="end">0</text>

  <path d="M 60 138.5 L 140 134 L 220 116.5 L 300 46" fill="none" stroke="#6c63ff" stroke-width="2.4"/>
  <g fill="#6c63ff">
    <circle cx="60" cy="138.5" r="3"/><circle cx="140" cy="134" r="3"/>
    <circle cx="220" cy="116.5" r="3"/><circle cx="300" cy="46" r="3"/>
  </g>
  <g fill="#8b949e" font-size="9">
    <text x="66" y="132">0.016</text>
    <text x="146" y="128">0.062</text>
    <text x="226" y="110">0.25</text>
    <text x="272" y="40">1.0</text>
  </g>
  <text x="180" y="196" fill="#8b949e" font-size="10.5" text-anchor="middle">attention only matches the FFN at ~32k tokens</text>

  <line x1="330" y1="20" x2="330" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- memory panel -->
  <text x="352" y="26" fill="#e6edf3" font-size="12">materialised attention matrix, per layer</text>
  <text x="352" y="42" fill="#8b949e" font-size="10">batch 8, 32 heads, fp16</text>

  <g fill="#8b949e" font-size="10.5" text-anchor="end">
    <text x="410" y="76">n = 512</text>
    <text x="410" y="108">n = 2048</text>
    <text x="410" y="140">n = 8192</text>
  </g>
  <rect x="418" y="64" width="3"   height="16" fill="#3fb950"/>
  <rect x="418" y="96" width="11"  height="16" fill="#d29922"/>
  <rect x="418" y="128" width="180" height="16" fill="#f85149"/>
  <g fill="#8b949e" font-size="9.5">
    <text x="428" y="77">0.13 GiB</text>
    <text x="436" y="109">2.0 GiB</text>
    <text x="452" y="140" fill="#e6edf3">32 GiB</text>
  </g>

  <text x="352" y="172" fill="#f85149" font-size="10.5">quadratic in n, and it must be held for the backward pass</text>

  <rect x="352" y="188" width="252" height="52" rx="6" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="478" y="208" fill="#3fb950" font-size="11" text-anchor="middle">FlashAttention: never materialise it</text>
  <text x="478" y="226" fill="#8b949e" font-size="9.5" text-anchor="middle">tile, keep a running softmax, recompute in the backward</text>

  <text x="330" y="270" fill="#e6edf3" font-size="11" text-anchor="middle">The &#8220;quadratic cost&#8221; framing points at the wrong resource.</text>
  <text x="330" y="288" fill="#8b949e" font-size="10.5" text-anchor="middle">At ordinary lengths the arithmetic is cheap and the memory traffic is what you are paying for.</text>
</svg>
