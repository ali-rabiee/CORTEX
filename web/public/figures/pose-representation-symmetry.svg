<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Two ways the output space breaks 6D pose estimation</title>
  <desc>Left: geodesic error for a network regressing rotation, identical except for the output representation. Euler, axis-angle and quaternion have mean errors near 5 to 7 degrees and worst cases near 180 degrees; the 6D representation has a mean of 0.44 degrees and a worst case of 1.27. Right: for an exactly four-fold symmetric object, the ADD metric scores a physically identical pose as 82 to 116 millimetres wrong while ADD-S scores it zero.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="330" y1="40" x2="330" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">Same network, different output space</text>
  <text x="20" y="40" fill="#8b949e" font-size="9">geodesic error, mean ●  worst case ●</text>
  <line x1="42" y1="248" x2="305" y2="248" stroke="#30363d"/>
  <line x1="42" y1="70" x2="42" y2="248" stroke="#30363d"/>
  <text x="36" y="86" fill="#8b949e" font-size="8.5" text-anchor="end">180°</text>
  <text x="36" y="160" fill="#8b949e" font-size="8.5" text-anchor="end">5°</text>
  <text x="36" y="212" fill="#8b949e" font-size="8.5" text-anchor="end">0.4°</text>

  <line x1="75" y1="151" x2="75" y2="82" stroke="#f85149" stroke-width="2"/>
  <circle cx="75" cy="151" r="4" fill="#f85149"/><circle cx="75" cy="82" r="4" fill="#f85149"/>
  <line x1="140" y1="158" x2="140" y2="83" stroke="#f85149" stroke-width="2"/>
  <circle cx="140" cy="158" r="4" fill="#f85149"/><circle cx="140" cy="83" r="4" fill="#f85149"/>
  <line x1="205" y1="159" x2="205" y2="82" stroke="#f85149" stroke-width="2"/>
  <circle cx="205" cy="159" r="4" fill="#f85149"/><circle cx="205" cy="82" r="4" fill="#f85149"/>
  <line x1="270" y1="209" x2="270" y2="187" stroke="#3fb950" stroke-width="2"/>
  <circle cx="270" cy="209" r="4" fill="#3fb950"/><circle cx="270" cy="187" r="4" fill="#3fb950"/>

  <text x="212" y="76" fill="#f85149" font-size="9">worst case ≈ 180°</text>
  <text x="278" y="205" fill="#3fb950" font-size="9">0.44°</text>
  <text x="278" y="184" fill="#3fb950" font-size="9">1.27°</text>

  <text x="75" y="264" fill="#8b949e" font-size="8.5" text-anchor="middle">Euler</text>
  <text x="140" y="264" fill="#8b949e" font-size="8.5" text-anchor="middle">axis-angle</text>
  <text x="205" y="264" fill="#8b949e" font-size="8.5" text-anchor="middle">quaternion</text>
  <text x="270" y="264" fill="#3fb950" font-size="8.5" text-anchor="middle">6D</text>
  <text x="173" y="282" fill="#8b949e" font-size="9" text-anchor="middle">3 dims          4 dims        6 dims</text>

  <text x="350" y="24" fill="#e6edf3" font-size="12" font-weight="600">ADD punishes a correct pose</text>
  <text x="350" y="40" fill="#8b949e" font-size="9">exactly 4-fold symmetric object</text>
  <line x1="376" y1="248" x2="626" y2="248" stroke="#30363d"/>
  <line x1="376" y1="70" x2="376" y2="248" stroke="#30363d"/>
  <text x="370" y="90" fill="#8b949e" font-size="8.5" text-anchor="end">120</text>
  <text x="370" y="181" fill="#8b949e" font-size="8.5" text-anchor="end">50</text>
  <text x="370" y="251" fill="#8b949e" font-size="8.5" text-anchor="end">0</text>
  <text x="350" y="58" fill="#8b949e" font-size="9">mm</text>

  <rect x="392" y="130" width="22" height="118" fill="#f85149"/>
  <rect x="416" y="246" width="22" height="2" fill="#3fb950"/>
  <text x="403" y="124" fill="#f85149" font-size="8.5" text-anchor="middle">82</text>
  <rect x="454" y="85" width="22" height="163" fill="#f85149"/>
  <rect x="478" y="246" width="22" height="2" fill="#3fb950"/>
  <text x="465" y="79" fill="#f85149" font-size="8.5" text-anchor="middle">116</text>
  <rect x="516" y="233" width="22" height="15" fill="#484f58"/>
  <rect x="540" y="235" width="22" height="13" fill="#3fb950"/>
  <rect x="578" y="220" width="22" height="28" fill="#484f58"/>
  <rect x="602" y="227" width="22" height="21" fill="#3fb950"/>

  <text x="415" y="262" fill="#8b949e" font-size="8" text-anchor="middle">90° sym</text>
  <text x="477" y="262" fill="#8b949e" font-size="8" text-anchor="middle">180° sym</text>
  <text x="539" y="262" fill="#8b949e" font-size="8" text-anchor="middle">5° error</text>
  <text x="601" y="262" fill="#8b949e" font-size="8" text-anchor="middle">15° error</text>
  <text x="446" y="278" fill="#f85149" font-size="8.5" text-anchor="middle">physically identical poses</text>
  <text x="570" y="278" fill="#8b949e" font-size="8.5" text-anchor="middle">genuinely wrong</text>
  <rect x="376" y="286" width="12" height="7" fill="#f85149"/><text x="392" y="293" fill="#8b949e" font-size="8">ADD</text>
  <rect x="428" y="286" width="12" height="7" fill="#3fb950"/><text x="444" y="293" fill="#8b949e" font-size="8">ADD-S</text>
</svg>
