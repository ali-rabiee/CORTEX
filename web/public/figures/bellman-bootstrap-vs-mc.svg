<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="bbt bbd" font-family="system-ui, -apple-system, sans-serif">
  <title id="bbt">Monte Carlo returns compared with a one-step bootstrapped target</title>
  <desc id="bbd">The top row waits for the whole episode and sums every reward,
    giving an unbiased but high-variance target. The bottom row uses one real
    reward plus the current estimate of the next state's value, which has low
    variance but is biased by whatever error that estimate already contains.</desc>

  <defs>
    <marker id="bbm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker>
    <marker id="bbt2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  </defs>

  <!-- shared trajectory of states -->
  <g>
    <g fill="#1c2128" stroke="#30363d">
      <circle cx="70"  cy="100" r="17"/>
      <circle cx="170" cy="100" r="17"/>
      <circle cx="270" cy="100" r="17"/>
      <circle cx="370" cy="100" r="17"/>
      <circle cx="470" cy="100" r="17"/>
      <circle cx="570" cy="100" r="17"/>
    </g>
    <g fill="#e6edf3" font-size="10.5" text-anchor="middle">
      <text x="70"  y="104">s&#8348;</text>
      <text x="170" y="104">s&#8348;&#8330;&#8321;</text>
      <text x="270" y="104">s&#8348;&#8330;&#8322;</text>
      <text x="370" y="104">&#8230;</text>
      <text x="470" y="104">&#8230;</text>
      <text x="570" y="104">s&#8348;</text>
    </g>
    <g stroke="#484f58" stroke-width="1.4">
      <line x1="87" y1="100" x2="153" y2="100"/>
      <line x1="187" y1="100" x2="253" y2="100"/>
      <line x1="287" y1="100" x2="353" y2="100"/>
      <line x1="387" y1="100" x2="453" y2="100"/>
      <line x1="487" y1="100" x2="553" y2="100"/>
    </g>
    <g fill="#8b949e" font-size="10" text-anchor="middle">
      <text x="120" y="92">r&#8348;</text>
      <text x="220" y="92">r&#8348;&#8330;&#8321;</text>
      <text x="320" y="92">r&#8348;&#8330;&#8322;</text>
      <text x="420" y="92">&#8230;</text>
      <text x="520" y="92">r&#8348;&#8331;&#8321;</text>
    </g>
    <text x="570" y="132" fill="#8b949e" font-size="10" text-anchor="middle">terminal</text>
  </g>

  <!-- Monte Carlo span -->
  <path d="M 70 62 L 570 62" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#bbm)"/>
  <line x1="70" y1="62" x2="70" y2="80" stroke="#d29922" stroke-width="2"/>
  <text x="320" y="52" fill="#d29922" font-size="12" text-anchor="middle">Monte Carlo target: G&#8348; = r&#8348; + &#947;r&#8348;&#8330;&#8321; + &#947;&#178;r&#8348;&#8330;&#8322; + &#8230;</text>
  <text x="320" y="30" fill="#d29922" font-size="11" text-anchor="middle">unbiased &#183; variance grows with the horizon &#183; must wait for the episode to end</text>

  <!-- TD one-step -->
  <path d="M 70 148 L 170 148" stroke="#3fb950" stroke-width="2.4" fill="none" marker-end="url(#bbt2)"/>
  <line x1="70" y1="130" x2="70" y2="148" stroke="#3fb950" stroke-width="2.4"/>
  <line x1="170" y1="148" x2="170" y2="130" stroke="#3fb950" stroke-width="2.4"/>

  <rect x="196" y="132" width="128" height="32" rx="6" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="260" y="152" fill="#3fb950" font-size="11" text-anchor="middle">V(s&#8348;&#8330;&#8321;) &#8212; your own</text>
  <line x1="196" y1="148" x2="182" y2="148" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="3 3"/>

  <text x="320" y="194" fill="#3fb950" font-size="12" text-anchor="middle">TD target: r&#8348; + &#947;V(s&#8348;&#8330;&#8321;)</text>
  <text x="320" y="214" fill="#3fb950" font-size="11" text-anchor="middle">low variance &#183; learns from one step &#183; biased by the error already in V</text>

  <line x1="40" y1="240" x2="600" y2="240" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="264" fill="#e6edf3" font-size="11.5" text-anchor="middle">The Bellman equation is what makes the second line legitimate:</text>
  <text x="320" y="282" fill="#8b949e" font-size="11.5" text-anchor="middle">V&#960;(s) = &#120124;[ r + &#947;V&#960;(s&#8242;) ] &#8212; the true value already satisfies it exactly.</text>
</svg>
