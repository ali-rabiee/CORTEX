<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Compliance removes the unknown environment stiffness from the problem</title>
  <desc>Robot and environment stiffnesses act as springs in series, so the softer one dominates. When the robot is stiff, the contact force at 1 mm of penetration spans 100 N to 91 kN across three decades of environment stiffness. When the robot is compliant at 10 kN per metre, the same range gives 9.1 to 10.0 N — nearly constant, so the unknown parameter stops mattering.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="20" y="26" fill="#e6edf3" font-size="13" font-weight="600">Springs in series: the soft element sets the force</text>
  <line x1="345" y1="42" x2="345" y2="282" stroke="#30363d"/>

  <rect x="24" y="96" width="30" height="60" rx="3" fill="#1c2128" stroke="#30363d"/>
  <text x="39" y="172" fill="#8b949e" font-size="9.5" text-anchor="middle">robot</text>
  <path d="M54 126 l10 -14 l14 28 l14 -28 l14 28 l14 -28 l10 14" fill="none" stroke="#6c63ff" stroke-width="2"/>
  <text x="96" y="106" fill="#6c63ff" font-size="10" text-anchor="middle">K_r</text>
  <rect x="140" y="106" width="18" height="40" rx="3" fill="#1c2128" stroke="#30363d"/>
  <path d="M158 126 l10 -14 l14 28 l14 -28 l14 28 l14 -28 l10 14" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="200" y="106" fill="#d29922" font-size="10" text-anchor="middle">K_e (unknown)</text>
  <rect x="244" y="86" width="14" height="80" fill="#1c2128" stroke="#30363d"/>
  <text x="251" y="180" fill="#8b949e" font-size="9.5" text-anchor="middle">world</text>

  <text x="24" y="212" fill="#e6edf3" font-size="11">1 / K_eff  =  1 / K_r  +  1 / K_e</text>
  <text x="24" y="234" fill="#8b949e" font-size="9.5">sensitivity to the unknown:</text>
  <text x="24" y="249" fill="#8b949e" font-size="9.5">dK_eff / dK_e = (K_eff / K_e)²</text>
  <text x="24" y="270" fill="#3fb950" font-size="9.5">K_r = 10⁴, K_e = 10⁶  →  10⁻⁴</text>
  <text x="24" y="284" fill="#f85149" font-size="9.5">K_r = 10⁶, K_e = 10⁶  →  0.25</text>

  <text x="372" y="58" fill="#e6edf3" font-size="11" font-weight="600">contact force at 1 mm penetration</text>
  <line x1="378" y1="252" x2="622" y2="252" stroke="#30363d"/>
  <line x1="378" y1="72" x2="378" y2="252" stroke="#30363d"/>
  <text x="372" y="84" fill="#8b949e" font-size="8.5" text-anchor="end">10⁵</text>
  <text x="372" y="152" fill="#8b949e" font-size="8.5" text-anchor="end">10³</text>
  <text x="372" y="220" fill="#8b949e" font-size="8.5" text-anchor="end">10¹</text>
  <text x="372" y="254" fill="#8b949e" font-size="8.5" text-anchor="end">N</text>

  <polyline points="390,182 463,148 610,81" fill="none" stroke="#f85149" stroke-width="2"/>
  <circle cx="390" cy="182" r="3.5" fill="#f85149"/><circle cx="463" cy="148" r="3.5" fill="#f85149"/><circle cx="610" cy="81" r="3.5" fill="#f85149"/>
  <text x="452" y="122" fill="#f85149" font-size="9.5">stiff robot: 100 N → 91 kN</text>

  <polyline points="390,218 463,217 610,217" fill="none" stroke="#3fb950" stroke-width="2"/>
  <circle cx="390" cy="218" r="3.5" fill="#3fb950"/><circle cx="463" cy="217" r="3.5" fill="#3fb950"/><circle cx="610" cy="217" r="3.5" fill="#3fb950"/>
  <text x="420" y="238" fill="#3fb950" font-size="9.5">compliant robot: 9.1 N → 10.0 N</text>

  <text x="390" y="266" fill="#8b949e" font-size="9" text-anchor="middle">10⁵</text>
  <text x="463" y="266" fill="#8b949e" font-size="9" text-anchor="middle">10⁶</text>
  <text x="610" y="266" fill="#8b949e" font-size="9" text-anchor="middle">10⁸</text>
  <text x="500" y="282" fill="#8b949e" font-size="9.5" text-anchor="middle">environment stiffness K_e  (N/m)</text>
</svg>
