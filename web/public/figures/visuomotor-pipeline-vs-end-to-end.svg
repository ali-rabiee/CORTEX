<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="vpt vpd" font-family="system-ui, -apple-system, sans-serif">
  <title id="vpt">A modular perception pipeline compared with an end-to-end visuomotor policy</title>
  <desc id="vpd">The modular pipeline passes a hand-chosen summary between each
    stage — a bounding box, then a six-degree-of-freedom pose, then a grasp —
    and anything a summary discards cannot be recovered downstream. The
    end-to-end policy passes a learned high-dimensional feature vector straight
    from the image encoder to the action head, so the task loss decides what to
    keep; the cost is that there is no longer an interface you can inspect.</desc>

  <defs>
    <marker id="vpg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
    <marker id="vpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/></marker>
  </defs>

  <!-- ===== modular ===== -->
  <text x="16" y="26" fill="#e6edf3" font-size="13" font-weight="600">Modular pipeline</text>

  <rect x="16" y="52" width="52" height="46" rx="5" fill="#1c2128" stroke="#484f58"/>
  <text x="42" y="80" fill="#8b949e" font-size="11" text-anchor="middle">image</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="104" y="52" width="104" height="46" rx="6"/>
    <rect x="244" y="52" width="104" height="46" rx="6"/>
    <rect x="384" y="52" width="104" height="46" rx="6"/>
    <rect x="524" y="52" width="100" height="46" rx="6"/>
  </g>
  <g fill="#e6edf3" font-size="11.5" text-anchor="middle">
    <text x="156" y="80">detector</text>
    <text x="296" y="80">pose est.</text>
    <text x="436" y="80">grasp plan</text>
    <text x="574" y="80">controller</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.4" marker-end="url(#vpg)">
    <line x1="70" y1="75" x2="98" y2="75"/>
    <line x1="210" y1="75" x2="238" y2="75"/>
    <line x1="350" y1="75" x2="378" y2="75"/>
    <line x1="490" y1="75" x2="518" y2="75"/>
  </g>
  <g fill="#f85149" font-size="10" text-anchor="middle">
    <text x="224" y="44">bbox</text>
    <text x="364" y="44">6-D pose</text>
    <text x="504" y="44">grasp</text>
  </g>
  <text x="320" y="122" fill="#f85149" font-size="11.5" text-anchor="middle">every interface is a hand-chosen summary &#8212; what it drops is gone for good</text>

  <line x1="16" y1="146" x2="624" y2="146" stroke="#30363d" stroke-width="1"/>

  <!-- ===== end to end ===== -->
  <text x="16" y="176" fill="#e6edf3" font-size="13" font-weight="600">End-to-end visuomotor policy</text>

  <rect x="16" y="202" width="52" height="46" rx="5" fill="#1c2128" stroke="#484f58"/>
  <text x="42" y="230" fill="#8b949e" font-size="11" text-anchor="middle">image</text>

  <rect x="132" y="202" width="150" height="46" rx="6" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.6"/>
  <text x="207" y="224" fill="#e6edf3" font-size="11.5" text-anchor="middle">conv / ViT encoder</text>
  <text x="207" y="240" fill="#8b949e" font-size="10.5" text-anchor="middle">+ spatial softmax</text>

  <rect x="392" y="202" width="150" height="46" rx="6" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.6"/>
  <text x="467" y="230" fill="#e6edf3" font-size="11.5" text-anchor="middle">action head</text>

  <line x1="70" y1="225" x2="126" y2="225" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#vpa)"/>
  <line x1="286" y1="225" x2="386" y2="225" stroke="#6c63ff" stroke-width="6" marker-end="url(#vpa)" opacity="0.85"/>
  <line x1="546" y1="225" x2="608" y2="225" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#vpa)"/>
  <text x="336" y="196" fill="#3fb950" font-size="10" text-anchor="middle">learned features</text>
  <text x="600" y="196" fill="#8b949e" font-size="10" text-anchor="middle">action</text>

  <text x="320" y="274" fill="#3fb950" font-size="11.5" text-anchor="middle">the task loss decides what to keep &#8212; nothing is summarised away by hand</text>
  <text x="320" y="290" fill="#f85149" font-size="11.5" text-anchor="middle">and there is no interface left to inspect when it fails</text>
</svg>
