<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Max-pooling reads a fraction of the cloud, and sensor density varies by two orders of magnitude</title>
  <desc>Left: in a trained PointNet, a mean of 93.6 points out of 1024 win the max over the bottleneck features. Keeping only those points leaves the prediction unchanged in all 512 test clouds, and deleting ninety percent of the remaining points also changes nothing. Right: depth-camera point density falls as one over range squared, so a two-centimetre neighbourhood contains 5215 points at 0.3 metres and 19 points at 5 metres.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="322" y1="40" x2="322" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">Only the critical set reaches the output</text>

  <g fill="#484f58">
    <circle cx="72" cy="96" r="2"/><circle cx="94" cy="86" r="2"/><circle cx="118" cy="82" r="2"/>
    <circle cx="142" cy="84" r="2"/><circle cx="166" cy="90" r="2"/><circle cx="190" cy="100" r="2"/>
    <circle cx="206" cy="114" r="2"/><circle cx="212" cy="132" r="2"/><circle cx="208" cy="150" r="2"/>
    <circle cx="196" cy="166" r="2"/><circle cx="176" cy="178" r="2"/><circle cx="152" cy="186" r="2"/>
    <circle cx="126" cy="188" r="2"/><circle cx="100" cy="184" r="2"/><circle cx="80" cy="174" r="2"/>
    <circle cx="64" cy="158" r="2"/><circle cx="58" cy="140" r="2"/><circle cx="60" cy="120" r="2"/>
    <circle cx="90" cy="112" r="2"/><circle cx="112" cy="104" r="2"/><circle cx="136" cy="106" r="2"/>
    <circle cx="160" cy="112" r="2"/><circle cx="180" cy="124" r="2"/><circle cx="186" cy="142" r="2"/>
    <circle cx="176" cy="158" r="2"/><circle cx="156" cy="168" r="2"/><circle cx="132" cy="172" r="2"/>
    <circle cx="108" cy="168" r="2"/><circle cx="88" cy="156" r="2"/><circle cx="82" cy="136" r="2"/>
    <circle cx="104" cy="128" r="2"/><circle cx="128" cy="126" r="2"/><circle cx="152" cy="132" r="2"/>
    <circle cx="160" cy="148" r="2"/><circle cx="140" cy="154" r="2"/><circle cx="114" cy="150" r="2"/>
  </g>
  <g fill="#3fb950">
    <circle cx="118" cy="82" r="3.6"/><circle cx="212" cy="132" r="3.6"/><circle cx="126" cy="188" r="3.6"/>
    <circle cx="58" cy="140" r="3.6"/><circle cx="190" cy="100" r="3.6"/><circle cx="80" cy="174" r="3.6"/>
  </g>
  <text x="20" y="216" fill="#3fb950" font-size="10">93.6 of 1024 points on average — 9.1%</text>
  <text x="20" y="234" fill="#e6edf3" font-size="9.5">keep only these: prediction unchanged, 512/512</text>
  <text x="20" y="248" fill="#e6edf3" font-size="9.5">delete 90% of the rest: unchanged, 512/512</text>
  <text x="20" y="270" fill="#8b949e" font-size="9">Robust to missing data, and blind to whatever is</text>
  <text x="20" y="282" fill="#8b949e" font-size="9">only visible in the other 91%.</text>

  <text x="342" y="24" fill="#e6edf3" font-size="12" font-weight="600">Density falls as 1/Z²</text>
  <text x="342" y="40" fill="#8b949e" font-size="9">points inside a 2 cm radius, 640×480 depth camera</text>
  <line x1="380" y1="248" x2="622" y2="248" stroke="#30363d"/>
  <line x1="380" y1="70" x2="380" y2="248" stroke="#30363d"/>
  <text x="374" y="84" fill="#8b949e" font-size="8.5" text-anchor="end">5000</text>
  <text x="374" y="152" fill="#8b949e" font-size="8.5" text-anchor="end">500</text>
  <text x="374" y="218" fill="#8b949e" font-size="8.5" text-anchor="end">50</text>

  <polyline points="380,80 422,109 478,149 535,188 610,240" fill="none" stroke="#6c63ff" stroke-width="2"/>
  <circle cx="380" cy="80" r="3.5" fill="#6c63ff"/><circle cx="422" cy="109" r="3.5" fill="#6c63ff"/>
  <circle cx="478" cy="149" r="3.5" fill="#6c63ff"/><circle cx="535" cy="188" r="3.5" fill="#6c63ff"/>
  <circle cx="610" cy="240" r="4.5" fill="#f85149"/>
  <text x="388" y="76" fill="#6c63ff" font-size="9">5215</text>
  <text x="606" y="234" fill="#f85149" font-size="9" text-anchor="end">19</text>

  <text x="380" y="264" fill="#8b949e" font-size="9" text-anchor="middle">0.3 m</text>
  <text x="478" y="264" fill="#8b949e" font-size="9" text-anchor="middle">1 m</text>
  <text x="610" y="264" fill="#8b949e" font-size="9" text-anchor="middle">5 m</text>
  <text x="342" y="282" fill="#8b949e" font-size="9">A fixed k = 32 spans 1.6 mm at 0.3 m and 26 mm at 5 m —</text>
  <text x="342" y="293" fill="#8b949e" font-size="9">neither fixed radius nor fixed k is scale-consistent.</text>
</svg>
