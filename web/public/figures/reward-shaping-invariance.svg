<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="rst rsd" font-family="system-ui, -apple-system, sans-serif">
  <title id="rst">Why shaping must be potential-based</title>
  <desc id="rsd">A naive bonus for moving toward the goal can be collected
    repeatedly by oscillating, so the agent earns more by cycling than by
    finishing — the optimal policy changes. A potential-based bonus, the
    discounted difference of a state potential, telescopes to zero around any
    cycle, so no loop can be profitable and the optimal policy is provably
    unchanged.</desc>

  <!-- LEFT: naive shaping -->
  <text x="20" y="26" fill="#f85149" font-size="12" font-weight="600">naive bonus: +1 for moving closer</text>

  <g fill="#1c2128" stroke="#30363d">
    <circle cx="70"  cy="110" r="18"/>
    <circle cx="150" cy="110" r="18"/>
    <circle cx="230" cy="110" r="18"/>
  </g>
  <circle cx="290" cy="110" r="20" fill="#1c2128" stroke="#3fb950" stroke-width="1.6"/>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="70" y="114">A</text><text x="150" y="114">B</text>
    <text x="230" y="114">C</text><text x="290" y="114" fill="#3fb950">goal</text>
  </g>

  <path d="M 88 104 L 132 104" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <text x="110" y="96" fill="#3fb950" font-size="9.5" text-anchor="middle">+1</text>
  <path d="M 132 118 L 88 118" stroke="#f85149" stroke-width="1.8" fill="none"/>
  <text x="110" y="134" fill="#f85149" font-size="9.5" text-anchor="middle">0</text>

  <path d="M 168 104 L 212 104" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <text x="190" y="96" fill="#3fb950" font-size="9.5" text-anchor="middle">+1</text>

  <rect x="24" y="156" width="266" height="52" rx="6" fill="#1c2128" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="157" y="176" fill="#f85149" font-size="10.5" text-anchor="middle">A&#8594;B&#8594;A&#8594;B&#8594;&#8230; earns +1 per two steps, forever</text>
  <text x="157" y="194" fill="#8b949e" font-size="10" text-anchor="middle">cycling beats finishing &#8212; the optimal policy changed</text>

  <line x1="320" y1="20" x2="320" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- RIGHT: potential-based -->
  <text x="342" y="26" fill="#3fb950" font-size="12" font-weight="600">potential-based: F = &#947;&#934;(s&#8242;) &#8722; &#934;(s)</text>

  <g fill="#1c2128" stroke="#30363d">
    <circle cx="392" cy="110" r="18"/>
    <circle cx="472" cy="110" r="18"/>
    <circle cx="552" cy="110" r="18"/>
  </g>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="392" y="114">A</text><text x="472" y="114">B</text><text x="552" y="114">C</text>
  </g>
  <g fill="#6c63ff" font-size="9" text-anchor="middle">
    <text x="392" y="142">&#934;=0</text><text x="472" y="142">&#934;=1</text><text x="552" y="142">&#934;=2</text>
  </g>

  <path d="M 410 104 L 454 104" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <text x="432" y="96" fill="#3fb950" font-size="9.5" text-anchor="middle">+&#947;</text>
  <path d="M 454 118 L 410 118" stroke="#f85149" stroke-width="1.8" fill="none"/>
  <text x="432" y="134" fill="#f85149" font-size="9.5" text-anchor="middle">&#8722;1</text>

  <path d="M 490 104 L 534 104" stroke="#3fb950" stroke-width="1.8" fill="none"/>
  <text x="512" y="96" fill="#3fb950" font-size="9.5" text-anchor="middle">+&#947;</text>

  <rect x="342" y="156" width="266" height="66" rx="6" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="475" y="176" fill="#3fb950" font-size="10.5" text-anchor="middle">A&#8594;B&#8594;A sums to &#947; &#8722; 1 &#60; 0</text>
  <text x="475" y="194" fill="#8b949e" font-size="10" text-anchor="middle">the potential telescopes: any cycle nets &#8804; 0,</text>
  <text x="475" y="210" fill="#8b949e" font-size="10" text-anchor="middle">so no loop is profitable</text>

  <text x="320" y="252" fill="#e6edf3" font-size="11" text-anchor="middle">The theorem: F(s,a,s&#8242;) = &#947;&#934;(s&#8242;) &#8722; &#934;(s) leaves the optimal policy unchanged, for ANY &#934;.</text>
  <text x="320" y="274" fill="#8b949e" font-size="10.5" text-anchor="middle">It is also the ONLY form with that guarantee &#8212; every other bonus is a change to the task you specified.</text>
</svg>
