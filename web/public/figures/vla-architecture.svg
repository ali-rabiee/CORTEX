<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="vat vad" font-family="system-ui, -apple-system, sans-serif">
  <title id="vat">A VLM and a VLA share everything except the output vocabulary</title>
  <desc id="vad">Both take image patches and instruction tokens into the same
    pretrained transformer. The vision-language model decodes text tokens. The
    vision-language-action model decodes action tokens instead — discretised
    joint or end-effector commands occupying slots in the same vocabulary — so
    the only structural change is what the output symbols mean.</desc>

  <defs>
    <marker id="vaa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/></marker>
  </defs>

  <!-- inputs -->
  <rect x="20" y="72" width="92" height="46" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="66" y="92" fill="#e6edf3" font-size="10.5" text-anchor="middle">image patches</text>
  <text x="66" y="107" fill="#8b949e" font-size="9.5" text-anchor="middle">ViT encoder</text>

  <rect x="20" y="140" width="92" height="46" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="66" y="160" fill="#e6edf3" font-size="10.5" text-anchor="middle">instruction</text>
  <text x="66" y="175" fill="#8b949e" font-size="9.5" text-anchor="middle">&#8220;put the cup away&#8221;</text>

  <!-- shared backbone -->
  <rect x="156" y="72" width="128" height="114" rx="8" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.65"/>
  <text x="220" y="118" fill="#e6edf3" font-size="11.5" text-anchor="middle">pretrained</text>
  <text x="220" y="134" fill="#e6edf3" font-size="11.5" text-anchor="middle">VLM transformer</text>
  <text x="220" y="152" fill="#8b949e" font-size="9.5" text-anchor="middle">billions of web image&#8211;text pairs</text>

  <g stroke="#6c63ff" stroke-width="1.5" marker-end="url(#vaa)">
    <line x1="116" y1="95"  x2="150" y2="110"/>
    <line x1="116" y1="163" x2="150" y2="148"/>
    <line x1="288" y1="112" x2="326" y2="92"/>
    <line x1="288" y1="146" x2="326" y2="200"/>
  </g>

  <!-- VLM branch -->
  <rect x="332" y="60" width="286" height="64" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="346" y="80" fill="#8b949e" font-size="11">VLM &#8212; decode text tokens</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="348" y="90" width="52" height="22" rx="4" fill="#30363d"/><text x="374" y="105" fill="#e6edf3">&#8220;a&#8221;</text>
    <rect x="406" y="90" width="60" height="22" rx="4" fill="#30363d"/><text x="436" y="105" fill="#e6edf3">&#8220;red&#8221;</text>
    <rect x="472" y="90" width="60" height="22" rx="4" fill="#30363d"/><text x="502" y="105" fill="#e6edf3">&#8220;cup&#8221;</text>
    <text x="576" y="105" fill="#8b949e">&#8230;</text>
  </g>

  <!-- VLA branch -->
  <rect x="332" y="164" width="286" height="88" rx="7" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="346" y="184" fill="#3fb950" font-size="11">VLA &#8212; decode action tokens</text>
  <g font-size="10" text-anchor="middle">
    <rect x="348" y="194" width="44" height="22" rx="4" fill="#30363d"/><text x="370" y="209" fill="#e6edf3">&#916;x</text>
    <rect x="398" y="194" width="44" height="22" rx="4" fill="#30363d"/><text x="420" y="209" fill="#e6edf3">&#916;y</text>
    <rect x="448" y="194" width="44" height="22" rx="4" fill="#30363d"/><text x="470" y="209" fill="#e6edf3">&#916;z</text>
    <rect x="498" y="194" width="52" height="22" rx="4" fill="#30363d"/><text x="524" y="209" fill="#e6edf3">rot&#8230;</text>
    <rect x="556" y="194" width="52" height="22" rx="4" fill="#30363d"/><text x="582" y="209" fill="#e6edf3">grip</text>
  </g>
  <text x="346" y="234" fill="#8b949e" font-size="10">each dimension binned into 256 values,</text>
  <text x="346" y="246" fill="#8b949e" font-size="10">placed in unused slots of the same vocabulary</text>

  <text x="320" y="278" fill="#e6edf3" font-size="11.5" text-anchor="middle">Same weights, same attention, same autoregressive decode.</text>
  <text x="320" y="294" fill="#8b949e" font-size="11" text-anchor="middle">The bet is that what the backbone knows about cups survives the change of vocabulary.</text>
</svg>
