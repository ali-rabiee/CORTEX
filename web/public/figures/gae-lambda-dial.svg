<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="glt gld" font-family="system-ui, -apple-system, sans-serif">
  <title id="glt">GAE's lambda as an exponential weighting and as a bias-variance dial</title>
  <desc id="gld">On the left, the weight GAE places on each n-step advantage
    estimator decays geometrically; a small lambda concentrates almost all
    weight on the one-step estimator, while a large lambda spreads it over many
    steps. On the right, bias falls and variance rises as lambda goes from zero
    to one, with the useful operating range around 0.9 to 0.97.</desc>

  <!-- ===== LEFT: weights over n-step estimators ===== -->
  <text x="20" y="26" fill="#e6edf3" font-size="12.5" font-weight="600">weight on the n-step estimator</text>
  <text x="20" y="44" fill="#8b949e" font-size="11">w&#8345; = (1&#8722;&#955;)&#955;&#8319;&#8315;&#185;</text>

  <line x1="46" y1="240" x2="290" y2="240" stroke="#484f58" stroke-width="1.2"/>
  <text x="168" y="262" fill="#8b949e" font-size="10.5" text-anchor="middle">n  (steps of real reward used)</text>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="60" y="254">1</text><text x="100" y="254">2</text><text x="140" y="254">3</text>
    <text x="180" y="254">4</text><text x="220" y="254">5</text><text x="260" y="254">6</text>
  </g>

  <!-- lambda = 0.5 bars -->
  <g fill="#d29922" opacity="0.85">
    <rect x="52" y="146" width="13" height="94"/>
    <rect x="92" y="193" width="13" height="47"/>
    <rect x="132" y="216" width="13" height="24"/>
    <rect x="172" y="228" width="13" height="12"/>
    <rect x="212" y="234" width="13" height="6"/>
    <rect x="252" y="237" width="13" height="3"/>
  </g>
  <text x="70" y="138" fill="#d29922" font-size="10.5">&#955; = 0.5  &#8212; trusts the critic</text>

  <!-- lambda = 0.95 bars -->
  <g fill="#3fb950" opacity="0.85">
    <rect x="67" y="228" width="13" height="12"/>
    <rect x="107" y="229" width="13" height="11"/>
    <rect x="147" y="229" width="13" height="11"/>
    <rect x="187" y="230" width="13" height="10"/>
    <rect x="227" y="230" width="13" height="10"/>
    <rect x="267" y="231" width="13" height="9"/>
  </g>
  <text x="150" y="212" fill="#3fb950" font-size="10.5">&#955; = 0.95 &#8212; nearly flat over many steps</text>

  <line x1="320" y1="20" x2="320" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- ===== RIGHT: bias / variance ===== -->
  <text x="344" y="26" fill="#e6edf3" font-size="12.5" font-weight="600">what &#955; trades</text>

  <line x1="366" y1="240" x2="612" y2="240" stroke="#484f58" stroke-width="1.2"/>
  <line x1="366" y1="240" x2="366" y2="60" stroke="#484f58" stroke-width="1.2"/>
  <text x="366" y="258" fill="#8b949e" font-size="10" text-anchor="middle">&#955;=0</text>
  <text x="612" y="258" fill="#8b949e" font-size="10" text-anchor="middle">&#955;=1</text>

  <path d="M 366 82 C 430 96, 470 172, 500 206 C 530 234, 570 238, 610 239"
        fill="none" stroke="#d29922" stroke-width="2.4"/>
  <text x="384" y="76" fill="#d29922" font-size="11">bias (from a wrong V)</text>

  <path d="M 366 236 C 420 234, 470 226, 512 202 C 552 178, 580 118, 610 70"
        fill="none" stroke="#f85149" stroke-width="2.4"/>
  <text x="530" y="96" fill="#f85149" font-size="11" text-anchor="end">variance</text>

  <rect x="546" y="60" width="34" height="180" fill="#3fb950" opacity="0.10"/>
  <text x="563" y="274" fill="#3fb950" font-size="10" text-anchor="middle">0.9&#8211;0.97</text>

  <text x="366" y="274" fill="#8b949e" font-size="10">TD residual</text>
  <text x="612" y="274" fill="#8b949e" font-size="10" text-anchor="end">Monte Carlo</text>
</svg>
