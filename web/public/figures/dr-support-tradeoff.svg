<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="drt drd" font-family="system-ui, -apple-system, sans-serif">
  <title id="drt">Widening the randomisation support lowers the achievable optimum</title>
  <desc id="drd">Three training distributions over a physical parameter. A narrow
    one yields a high-performing specialist that fails if reality lies outside
    it. A well-chosen one covers reality with a modest loss of peak performance.
    An over-wide one forces a single policy to work across environments needing
    incompatible strategies, so the achievable optimum drops below the level
    needed to do the task.</desc>

  <defs>
    <marker id="drx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
  </defs>

  <!-- reality marker -->
  <line x1="386" y1="34" x2="386" y2="248" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="386" y="28" fill="#f85149" font-size="11" text-anchor="middle">&#958; of the real robot</text>

  <line x1="40" y1="248" x2="612" y2="248" stroke="#484f58" stroke-width="1.2"/>
  <text x="326" y="292" fill="#8b949e" font-size="11" text-anchor="middle">randomisation support p(&#958;)</text>

  <!-- narrow -->
  <rect x="180" y="196" width="70" height="52" fill="#f85149" opacity="0.10"/>
  <path d="M 172 246 C 200 246, 206 74, 216 74 C 226 74, 232 246, 260 246"
        fill="none" stroke="#f85149" stroke-width="2.4"/>
  <text x="216" y="66" fill="#f85149" font-size="10.5" text-anchor="middle">too narrow</text>
  <text x="216" y="52" fill="#8b949e" font-size="10" text-anchor="middle">specialist &#183; misses reality</text>

  <!-- good -->
  <rect x="278" y="196" width="200" height="52" fill="#3fb950" opacity="0.10"/>
  <path d="M 272 246 C 306 246, 316 116, 378 114 C 440 112, 452 246, 486 246"
        fill="none" stroke="#3fb950" stroke-width="2.6"/>
  <text x="378" y="106" fill="#3fb950" font-size="10.5" text-anchor="middle">wide enough, no wider</text>

  <!-- too wide -->
  <rect x="56" y="196" width="540" height="52" fill="#d29922" opacity="0.06"/>
  <path d="M 50 246 C 130 244, 180 204, 320 202 C 460 200, 520 240, 600 246"
        fill="none" stroke="#d29922" stroke-width="2.4"/>
  <text x="320" y="194" fill="#d29922" font-size="10.5" text-anchor="middle">over-randomised: no single strategy works everywhere</text>

  <!-- threshold -->
  <line x1="40" y1="176" x2="612" y2="176" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="46" y="170" fill="#8b949e" font-size="10">minimum performance to do the task at all</text>

  <line x1="26" y1="248" x2="26" y2="70" stroke="#484f58" stroke-width="1.2" marker-end="url(#drx)"/>
  <text x="20" y="150" fill="#8b949e" font-size="10.5" transform="rotate(-90 20 150)" text-anchor="middle">performance at &#958;</text>

  <text x="326" y="272" fill="#8b949e" font-size="10.5" text-anchor="middle">one policy must serve the whole support, so more support means a lower ceiling</text>
</svg>
