<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="vqt vqd" font-family="system-ui, -apple-system, sans-serif">
  <title id="vqt">V, Q and the advantage at a single state</title>
  <desc id="vqd">At one state, each available action has a Q value shown as a
    bar. V is the average of those Q values weighted by how often the policy
    takes each action, drawn as a horizontal line through them. The advantage of
    an action is its signed distance from that line, and because the line is the
    policy-weighted mean, the advantages average to exactly zero under the
    policy.</desc>

  <defs>
    <marker id="vqa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
    <marker id="vqb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker>
  </defs>

  <text x="24" y="28" fill="#e6edf3" font-size="12.5">one state s, four available actions</text>

  <line x1="70" y1="250" x2="470" y2="250" stroke="#484f58" stroke-width="1.2"/>

  <!-- bars: Q values -->
  <g fill="#30363d" stroke="#484f58">
    <rect x="100" y="106" width="52" height="144"/>
    <rect x="190" y="166" width="52" height="84"/>
    <rect x="280" y="86"  width="52" height="164"/>
    <rect x="370" y="212" width="52" height="38"/>
  </g>
  <g fill="#8b949e" font-size="10.5" text-anchor="middle">
    <text x="126" y="268">a&#8321;</text>
    <text x="216" y="268">a&#8322;</text>
    <text x="306" y="268">a&#8323;</text>
    <text x="396" y="268">a&#8324;</text>
  </g>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="126" y="284">&#960;=.35</text>
    <text x="216" y="284">&#960;=.25</text>
    <text x="306" y="284">&#960;=.15</text>
    <text x="396" y="284">&#960;=.25</text>
  </g>
  <text x="82" y="100" fill="#8b949e" font-size="10.5" text-anchor="end">Q&#960;(s,a)</text>

  <!-- V line -->
  <line x1="76" y1="152" x2="466" y2="152" stroke="#6c63ff" stroke-width="2.4"/>
  <text x="476" y="149" fill="#6c63ff" font-size="11.5">V&#960;(s)</text>
  <text x="476" y="164" fill="#8b949e" font-size="10">= &#931;&#8342; &#960;(a|s) Q&#960;(s,a)</text>

  <!-- advantages -->
  <line x1="126" y1="150" x2="126" y2="112" stroke="#3fb950" stroke-width="2.2" marker-end="url(#vqa)"/>
  <line x1="216" y1="154" x2="216" y2="160" stroke="#f85149" stroke-width="2.2" marker-end="url(#vqb)"/>
  <line x1="306" y1="150" x2="306" y2="92"  stroke="#3fb950" stroke-width="2.2" marker-end="url(#vqa)"/>
  <line x1="396" y1="154" x2="396" y2="206" stroke="#f85149" stroke-width="2.2" marker-end="url(#vqb)"/>

  <g font-size="10.5" text-anchor="middle">
    <text x="126" y="102" fill="#3fb950">A &#62; 0</text>
    <text x="216" y="180" fill="#f85149">A &#60; 0</text>
    <text x="306" y="80"  fill="#3fb950">A &#62; 0</text>
    <text x="396" y="226" fill="#f85149">A &#60; 0</text>
  </g>

  <!-- identity box -->
  <rect x="474" y="186" width="152" height="72" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="550" y="210" fill="#e6edf3" font-size="11.5" text-anchor="middle">&#120124;&#8342;&#8342;&#960;[ A&#960;(s,a) ] = 0</text>
  <text x="550" y="230" fill="#8b949e" font-size="10" text-anchor="middle">the green area equals</text>
  <text x="550" y="244" fill="#8b949e" font-size="10" text-anchor="middle">the red area, by construction</text>

  <text x="550" y="86" fill="#8b949e" font-size="10.5" text-anchor="middle">V is a &#960;-weighted mean,</text>
  <text x="550" y="102" fill="#8b949e" font-size="10.5" text-anchor="middle">not the max &#8212; that is V*,</text>
  <text x="550" y="118" fill="#8b949e" font-size="10.5" text-anchor="middle">a different object.</text>
</svg>
