<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>The conditional mean lands in the valley, and per-dimension bins cannot fix it</title>
  <desc>Left: a two-mode action distribution where the MSE optimum sits in the valley between modes — no expert action falls within 0.3 of it, while 47.7 percent fall that close to a mode. Right: a two-dimensional expert that only ever plays left-up or right-down. Per-dimension discretisation reproduces both marginals correctly and still places half its joint probability mass on the two combinations that never occurred.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="326" y1="40" x2="326" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">MSE picks the valley</text>
  <line x1="40" y1="212" x2="300" y2="212" stroke="#30363d"/>
  <path d="M52 212 C 74 212, 76 96, 87 96 C 98 96, 100 212, 122 212" fill="#6c63ff" fill-opacity="0.25" stroke="#6c63ff" stroke-width="1.8"/>
  <path d="M208 212 C 230 212, 232 96, 243 96 C 254 96, 256 212, 278 212" fill="#6c63ff" fill-opacity="0.25" stroke="#6c63ff" stroke-width="1.8"/>
  <text x="87" y="228" fill="#8b949e" font-size="9" text-anchor="middle">−1</text>
  <text x="243" y="228" fill="#8b949e" font-size="9" text-anchor="middle">+1</text>

  <rect x="141" y="86" width="48" height="126" fill="#f85149" fill-opacity="0.12"/>
  <line x1="165" y1="80" x2="165" y2="212" stroke="#f85149" stroke-width="2"/>
  <circle cx="165" cy="212" r="4" fill="#f85149"/>
  <text x="165" y="74" fill="#f85149" font-size="9.5" text-anchor="middle">MSE optimum</text>
  <text x="40" y="252" fill="#f85149" font-size="9.5">0.00% of expert actions within 0.3 of it</text>
  <text x="40" y="266" fill="#3fb950" font-size="9.5">47.7% within 0.3 of a mode</text>
  <text x="40" y="282" fill="#8b949e" font-size="9">L1 does not fix it: the median jumps between modes as the</text>

  <text x="346" y="24" fill="#e6edf3" font-size="12" font-weight="600">Right marginals, impossible joint</text>
  <line x1="470" y1="70" x2="470" y2="230" stroke="#30363d"/>
  <line x1="390" y1="150" x2="600" y2="150" stroke="#30363d"/>

  <rect x="390" y="70" width="80" height="80" fill="#f85149" fill-opacity="0.10"/>
  <rect x="470" y="150" width="130" height="80" fill="#f85149" fill-opacity="0.10"/>
  <text x="430" y="108" fill="#f85149" font-size="9" text-anchor="middle">never</text>
  <text x="430" y="120" fill="#f85149" font-size="9" text-anchor="middle">demonstrated</text>
  <text x="535" y="190" fill="#f85149" font-size="9" text-anchor="middle">never</text>
  <text x="535" y="202" fill="#f85149" font-size="9" text-anchor="middle">demonstrated</text>

  <ellipse cx="425" cy="105" rx="17" ry="17" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950"/>
  <text x="425" y="92" fill="#3fb950" font-size="9" text-anchor="middle">left-up</text>
  <ellipse cx="515" cy="195" rx="17" ry="17" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950"/>
  <text x="515" y="219" fill="#3fb950" font-size="9" text-anchor="middle">right-down</text>

  <rect x="417" y="238" width="16" height="10" fill="#6c63ff"/><rect x="507" y="238" width="16" height="10" fill="#6c63ff"/>
  <text x="470" y="258" fill="#8b949e" font-size="8.5" text-anchor="middle">x marginal: correctly bimodal</text>
  <rect x="608" y="97" width="10" height="16" fill="#6c63ff"/><rect x="608" y="187" width="10" height="16" fill="#6c63ff"/>
  <text x="604" y="150" fill="#8b949e" font-size="8.5" text-anchor="end">y marginal ✓</text>

  <text x="346" y="278" fill="#e6edf3" font-size="9.5">product of marginals puts <tspan fill="#f85149" font-weight="600">50%</tspan> of its mass on the</text>
  <text x="346" y="291" fill="#e6edf3" font-size="9.5">two combinations that never occurred</text>
  <text x="40" y="293" fill="#8b949e" font-size="9">mode balance crosses 50/50 (see the details)</text>
</svg>
