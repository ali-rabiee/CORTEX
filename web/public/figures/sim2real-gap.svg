<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="s2t s2d" font-family="system-ui, -apple-system, sans-serif">
  <title id="s2t">Three responses to the reality gap</title>
  <desc id="s2d">Along an axis of physical parameters, the simulator sits at one
    point and reality sits at another, unknown one. A policy trained only at the
    simulator's point performs well in a narrow band around it and collapses at
    reality. System identification moves the simulator toward reality but cannot
    close a gap caused by effects the model does not contain. Domain
    randomisation instead trains across a wide band of parameters, giving a
    lower peak but coverage that includes reality.</desc>

  <!-- axis -->
  <line x1="40" y1="252" x2="612" y2="252" stroke="#484f58" stroke-width="1.2"/>
  <text x="326" y="276" fill="#8b949e" font-size="11" text-anchor="middle">physical parameters &#958; (friction, mass, latency, actuator response, &#8230;)</text>

  <!-- reality marker -->
  <line x1="470" y1="44" x2="470" y2="252" stroke="#f85149" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="470" y="38" fill="#f85149" font-size="11" text-anchor="middle">reality (unknown)</text>

  <!-- sim marker -->
  <line x1="220" y1="70" x2="220" y2="252" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="220" y="62" fill="#8b949e" font-size="11" text-anchor="middle">simulator</text>

  <!-- narrow performance peak: train at sim only -->
  <path d="M 150 250 C 190 250, 200 96, 220 96 C 240 96, 250 250, 292 250"
        fill="none" stroke="#6c63ff" stroke-width="2.6"/>
  <text x="112" y="112" fill="#6c63ff" font-size="11">train in sim only</text>
  <text x="112" y="128" fill="#8b949e" font-size="10">tall, narrow &#8212; and RL will</text>
  <text x="112" y="142" fill="#8b949e" font-size="10">actively exploit the sim&#8217;s errors</text>

  <circle cx="470" cy="250" r="4.5" fill="#f85149"/>
  <text x="484" y="248" fill="#f85149" font-size="10.5">performance here &#8776; 0</text>

  <!-- DR broad band -->
  <rect x="300" y="176" width="270" height="76" fill="#3fb950" opacity="0.08"/>
  <path d="M 296 250 C 330 250, 340 182, 380 180 C 440 176, 500 178, 546 182
           C 572 184, 578 250, 594 250"
        fill="none" stroke="#3fb950" stroke-width="2.6"/>
  <text x="434" y="166" fill="#3fb950" font-size="11" text-anchor="middle">domain randomisation: lower peak, wider support</text>

  <!-- sysid arrow -->
  <path d="M 226 224 L 300 224" stroke="#d29922" stroke-width="1.8" fill="none"
        marker-end="url(#s2arr)"/>
  <defs>
    <marker id="s2arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/></marker>
  </defs>
  <text x="264" y="216" fill="#d29922" font-size="10" text-anchor="middle">system ID</text>
  <text x="264" y="240" fill="#8b949e" font-size="9.5" text-anchor="middle">moves &#958;, cannot</text>
  <text x="264" y="250" fill="#8b949e" font-size="9.5" text-anchor="middle">add missing physics</text>
</svg>
