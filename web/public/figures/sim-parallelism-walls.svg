<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Two reasons simulation moved onto the GPU</title>
  <desc>Left: with physics on the CPU and the policy on the GPU, the per-step round trip needs 23.6 GB/s at 4096 environments and 94 GB/s at 16384, against roughly 25 GB/s achievable over PCIe 4.0 x16. Right: for a fixed batch of 65,536 transitions with within-episode correlation 0.99, spreading collection over more environments raises the effective sample size from 330 to 16,590.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="316" y1="40" x2="316" y2="282" stroke="#30363d"/>

  <text x="20" y="26" fill="#e6edf3" font-size="12" font-weight="600">The transfer wall, not the physics</text>
  <text x="20" y="42" fill="#8b949e" font-size="9.5">CPU physics + GPU policy, 10⁴ steps/s, 60-dim obs</text>
  <line x1="55" y1="248" x2="285" y2="248" stroke="#30363d"/>
  <line x1="55" y1="60" x2="55" y2="248" stroke="#30363d"/>
  <text x="49" y="84" fill="#8b949e" font-size="8.5" text-anchor="end">100</text>
  <text x="49" y="164" fill="#8b949e" font-size="8.5" text-anchor="end">10</text>
  <text x="49" y="244" fill="#8b949e" font-size="8.5" text-anchor="end">1</text>
  <text x="20" y="56" fill="#8b949e" font-size="9">GB/s</text>

  <line x1="55" y1="128" x2="285" y2="128" stroke="#f85149" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="123" fill="#f85149" font-size="9">PCIe 4.0 ×16 ceiling ≈ 25 GB/s</text>

  <polyline points="70,226 130,178 190,130 250,81" fill="none" stroke="#6c63ff" stroke-width="2"/>
  <circle cx="70" cy="226" r="3.5" fill="#6c63ff"/><circle cx="130" cy="178" r="3.5" fill="#6c63ff"/>
  <circle cx="190" cy="130" r="3.5" fill="#d29922"/><circle cx="250" cy="81" r="3.5" fill="#f85149"/>
  <text x="196" y="146" fill="#d29922" font-size="9">23.6</text>
  <text x="256" y="76" fill="#f85149" font-size="9">94.4</text>
  <text x="70" y="264" fill="#8b949e" font-size="9" text-anchor="middle">256</text>
  <text x="130" y="264" fill="#8b949e" font-size="9" text-anchor="middle">1k</text>
  <text x="190" y="264" fill="#8b949e" font-size="9" text-anchor="middle">4k</text>
  <text x="250" y="264" fill="#8b949e" font-size="9" text-anchor="middle">16k</text>
  <text x="170" y="282" fill="#8b949e" font-size="9.5" text-anchor="middle">parallel environments</text>

  <text x="336" y="26" fill="#e6edf3" font-size="12" font-weight="600">Same batch, more independent information</text>
  <text x="336" y="42" fill="#8b949e" font-size="9.5">65,536 transitions, within-episode correlation 0.99</text>
  <line x1="358" y1="248" x2="620" y2="248" stroke="#30363d"/>

  <rect x="365" y="212" width="42" height="36" rx="2" fill="#484f58"/>
  <text x="386" y="206" fill="#8b949e" font-size="9.5" text-anchor="middle">330</text>
  <rect x="425" y="202" width="42" height="46" rx="2" fill="#6c63ff" opacity="0.6"/>
  <text x="446" y="196" fill="#8b949e" font-size="9.5" text-anchor="middle">514</text>
  <rect x="485" y="153" width="42" height="95" rx="2" fill="#6c63ff"/>
  <text x="506" y="147" fill="#e6edf3" font-size="9.5" text-anchor="middle">4318</text>
  <rect x="545" y="122" width="42" height="126" rx="2" fill="#3fb950"/>
  <text x="566" y="116" fill="#3fb950" font-size="9.5" text-anchor="middle">16590</text>

  <text x="386" y="262" fill="#8b949e" font-size="8.5" text-anchor="middle">1 × 65536</text>
  <text x="446" y="262" fill="#8b949e" font-size="8.5" text-anchor="middle">256 × 256</text>
  <text x="506" y="262" fill="#8b949e" font-size="8.5" text-anchor="middle">4096 × 16</text>
  <text x="566" y="262" fill="#8b949e" font-size="8.5" text-anchor="middle">16384 × 4</text>
  <text x="476" y="280" fill="#8b949e" font-size="9.5" text-anchor="middle">envs × steps per env    (effective sample size)</text>
</svg>
