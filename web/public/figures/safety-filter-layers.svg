<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="sft sfd" font-family="system-ui, -apple-system, sans-serif">
  <title id="sft">Safety as an independent layer, not a property of the policy</title>
  <desc id="sfd">The learned policy proposes an action. A safety filter with its
    own sensing and its own simple model projects that action onto the set of
    actions that keep the system inside a verified safe region, changing it only
    when necessary. Below both sits a real-time limit checker and a hardware
    stop, each simpler and more verifiable than the layer above it.</desc>

  <defs>
    <marker id="sfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
  </defs>

  <!-- policy -->
  <rect x="24" y="60" width="126" height="52" rx="7" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.6"/>
  <text x="87" y="82" fill="#e6edf3" font-size="11" text-anchor="middle">learned policy</text>
  <text x="87" y="98" fill="#8b949e" font-size="9.5" text-anchor="middle">no guarantees, always answers</text>

  <line x1="154" y1="86" x2="196" y2="86" stroke="#8b949e" stroke-width="1.5" marker-end="url(#sfa)"/>
  <text x="175" y="76" fill="#8b949e" font-size="9" text-anchor="middle">u&#7480;</text>

  <!-- filter -->
  <rect x="200" y="52" width="180" height="68" rx="7" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.65"/>
  <text x="290" y="74" fill="#3fb950" font-size="11.5" text-anchor="middle">safety filter</text>
  <text x="290" y="92" fill="#8b949e" font-size="9.5" text-anchor="middle">min &#8214;u &#8722; u&#7480;&#8214;&#178;  s.t.  h&#775; &#8805; &#8722;&#945;(h)</text>
  <text x="290" y="108" fill="#8b949e" font-size="9.5" text-anchor="middle">own sensing, own simple model</text>

  <line x1="384" y1="86" x2="426" y2="86" stroke="#8b949e" stroke-width="1.5" marker-end="url(#sfa)"/>
  <text x="405" y="76" fill="#3fb950" font-size="9" text-anchor="middle">u*</text>

  <rect x="430" y="60" width="110" height="52" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="485" y="90" fill="#e6edf3" font-size="11" text-anchor="middle">actuators</text>

  <text x="290" y="140" fill="#3fb950" font-size="10" text-anchor="middle">changes the action only when the constraint would be violated</text>

  <!-- layers below -->
  <line x1="24" y1="158" x2="616" y2="158" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="180" fill="#8b949e" font-size="10.5">defence in depth &#8212; each layer simpler and more verifiable than the one above</text>

  <rect x="24" y="192" width="592" height="26" rx="5" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.4"/>
  <text x="320" y="209" fill="#8b949e" font-size="10" text-anchor="middle">learned policy &#8212; capable, unverifiable</text>

  <rect x="64" y="222" width="512" height="26" rx="5" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="320" y="239" fill="#8b949e" font-size="10" text-anchor="middle">safety filter / backup controller &#8212; simple model, provable invariance</text>

  <rect x="124" y="252" width="392" height="24" rx="5" fill="#1c2128" stroke="#d29922" stroke-opacity="0.55"/>
  <text x="320" y="268" fill="#8b949e" font-size="10" text-anchor="middle">real-time limit checker &#8212; joint, velocity, force bounds</text>

  <rect x="204" y="280" width="232" height="18" rx="4" fill="#1c2128" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="320" y="293" fill="#8b949e" font-size="9.5" text-anchor="middle">hardware e-stop &#8212; no software in the path</text>
</svg>
