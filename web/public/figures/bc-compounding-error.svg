<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="title desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="title">Compounding error in behavior cloning</title>
  <desc id="desc">The learner's trajectory starts on the expert's path and drifts
    further away at every step, because each small error moves it into states the
    expert never demonstrated.</desc>

  <!-- baseline grid -->
  <g stroke="#30363d" stroke-width="1" opacity="0.5">
    <line x1="50" y1="270" x2="600" y2="270"/>
  </g>
  <text x="50" y="290" fill="#484f58" font-size="12">t = 0</text>
  <text x="565" y="290" fill="#484f58" font-size="12">t = T</text>

  <!-- growing divergence, drawn behind the curves -->
  <g stroke="#f85149" stroke-width="1" stroke-dasharray="3 3" opacity="0.55">
    <line x1="260" y1="150" x2="260" y2="165"/>
    <line x1="360" y1="130" x2="360" y2="160"/>
    <line x1="460" y1="113" x2="460" y2="180"/>
    <line x1="560" y1="100" x2="560" y2="225"/>
  </g>

  <!-- expert trajectory -->
  <polyline points="60,200 160,175 260,150 360,130 460,113 560,100"
            fill="none" stroke="#3fb950" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- learner trajectory -->
  <polyline points="60,200 160,180 260,165 360,160 460,180 560,225"
            fill="none" stroke="#f85149" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="7 4"/>

  <!-- shared start -->
  <circle cx="60" cy="200" r="4.5" fill="#e6edf3"/>
  <text x="46" y="222" fill="#8b949e" font-size="12">same start</text>

  <!-- annotations -->
  <g fill="#8b949e" font-size="12.5">
    <circle cx="260" cy="165" r="3" fill="#f85149"/>
    <text x="228" y="192">tiny error</text>

    <circle cx="460" cy="180" r="3" fill="#f85149"/>
    <text x="360" y="212">states the expert never showed</text>

    <circle cx="560" cy="225" r="3.5" fill="#f85149"/>
    <text x="498" y="250" fill="#f85149">off the rails</text>
  </g>

  <!-- legend -->
  <g font-size="12.5">
    <line x1="330" y1="46" x2="362" y2="46" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="370" y="50" fill="#8b949e">expert demonstrations</text>
    <line x1="330" y1="70" x2="362" y2="70" stroke="#f85149" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="7 4"/>
    <text x="370" y="74" fill="#8b949e">cloned policy</text>
  </g>
</svg>
