<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="dqt dqd" font-family="system-ui, -apple-system, sans-serif">
  <title id="dqt">The two DQN stabilisers and the correlations each one breaks</title>
  <desc id="dqd">Online Q-learning trains on consecutive frames, which are nearly
    identical, and regresses toward a target computed from the network being
    updated. The replay buffer breaks the correlation between samples within a
    batch; the frozen target network breaks the correlation between the
    prediction and the thing it is chasing.</desc>

  <!-- ===== TOP: the naive loop ===== -->
  <text x="20" y="26" fill="#f85149" font-size="12.5" font-weight="600">naive online Q-learning: two coupled loops</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="34" y="52" width="86" height="34" rx="5"/>
    <rect x="150" y="52" width="86" height="34" rx="5"/>
    <rect x="266" y="52" width="86" height="34" rx="5"/>
    <rect x="382" y="52" width="86" height="34" rx="5"/>
  </g>
  <g fill="#e6edf3" font-size="10.5" text-anchor="middle">
    <text x="77" y="73">frame t</text>
    <text x="193" y="73">frame t+1</text>
    <text x="309" y="73">frame t+2</text>
    <text x="425" y="73">frame t+3</text>
  </g>
  <text x="252" y="104" fill="#f85149" font-size="11" text-anchor="middle">consecutive, near-identical &#8212; a batch of these is one sample wearing four hats</text>

  <rect x="500" y="46" width="112" height="46" rx="6" fill="#1c2128" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="556" y="66" fill="#e6edf3" font-size="10.5" text-anchor="middle">Q&#952;</text>
  <text x="556" y="82" fill="#f85149" font-size="10" text-anchor="middle">predicts AND sets target</text>

  <line x1="120" y1="40" x2="120" y2="126" stroke="#30363d" stroke-width="0"/>
  <line x1="20" y1="122" x2="620" y2="122" stroke="#30363d" stroke-width="1"/>

  <!-- ===== BOTTOM LEFT: replay ===== -->
  <text x="20" y="150" fill="#3fb950" font-size="12.5" font-weight="600">replay buffer</text>
  <text x="20" y="166" fill="#8b949e" font-size="10.5">breaks correlation between samples</text>

  <rect x="24" y="180" width="250" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <g fill="#484f58">
    <circle cx="44" cy="206" r="4"/><circle cx="66" cy="196" r="4"/><circle cx="88" cy="216" r="4"/>
    <circle cx="110" cy="200" r="4"/><circle cx="132" cy="220" r="4"/><circle cx="154" cy="194" r="4"/>
    <circle cx="176" cy="212" r="4"/><circle cx="198" cy="198" r="4"/><circle cx="220" cy="218" r="4"/>
    <circle cx="242" cy="202" r="4"/>
  </g>
  <g fill="#3fb950">
    <circle cx="66" cy="196" r="5"/><circle cx="132" cy="220" r="5"/>
    <circle cx="198" cy="198" r="5"/><circle cx="242" cy="202" r="5"/>
  </g>
  <text x="149" y="252" fill="#3fb950" font-size="10.5" text-anchor="middle">a batch is drawn from across hours of experience,</text>
  <text x="149" y="266" fill="#3fb950" font-size="10.5" text-anchor="middle">not from one second of it</text>

  <line x1="300" y1="136" x2="300" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- ===== BOTTOM RIGHT: target net ===== -->
  <text x="322" y="150" fill="#3fb950" font-size="12.5" font-weight="600">frozen target network</text>
  <text x="322" y="166" fill="#8b949e" font-size="10.5">breaks correlation between prediction and target</text>

  <rect x="330" y="184" width="110" height="40" rx="6" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.6"/>
  <text x="385" y="208" fill="#e6edf3" font-size="11" text-anchor="middle">Q&#952; (updated)</text>

  <rect x="490" y="184" width="118" height="40" rx="6" fill="#1c2128" stroke="#484f58"/>
  <text x="549" y="202" fill="#8b949e" font-size="11" text-anchor="middle">Q&#952;&#8315; (frozen)</text>
  <text x="549" y="217" fill="#484f58" font-size="9.5" text-anchor="middle">copied every N steps</text>

  <path d="M 442 196 L 486 196" stroke="#8b949e" stroke-width="1.4" fill="none"/>
  <path d="M 486 214 L 444 214" stroke="#3fb950" stroke-width="1.6" fill="none"/>
  <text x="464" y="188" fill="#8b949e" font-size="9">copy</text>
  <text x="464" y="234" fill="#3fb950" font-size="9" text-anchor="middle">target</text>

  <text x="469" y="266" fill="#8b949e" font-size="10.5" text-anchor="middle">the thing being chased holds still</text>
  <text x="469" y="280" fill="#8b949e" font-size="10.5" text-anchor="middle">long enough to be caught</text>
</svg>
