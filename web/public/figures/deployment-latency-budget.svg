<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="dlt dld" font-family="system-ui, -apple-system, sans-serif">
  <title id="dlt">The control-loop latency budget, and what jitter does to it</title>
  <desc id="dld">A control period is divided into sensing, network transport,
    inference, and actuation. The top bar shows a nominal loop that fits inside
    the period. The bottom bar shows the same loop when inference occasionally
    takes far longer: the deadline is missed, the previous action is held, and
    the effective delay for that cycle doubles. Deployment is limited by the
    slow tail, not by the average.</desc>

  <!-- period markers -->
  <line x1="60" y1="52" x2="60" y2="212" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="380" y1="52" x2="380" y2="212" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="220" y="44" fill="#8b949e" font-size="10.5" text-anchor="middle">one control period (10 Hz &#8594; 100 ms)</text>

  <!-- nominal -->
  <text x="20" y="88" fill="#3fb950" font-size="11" font-weight="600">typical</text>
  <g>
    <rect x="60"  y="72" width="46"  height="26" fill="#30363d" stroke="#484f58"/>
    <rect x="106" y="72" width="30"  height="26" fill="#30363d" stroke="#484f58"/>
    <rect x="136" y="72" width="150" height="26" fill="#6c63ff" opacity="0.75"/>
    <rect x="286" y="72" width="40"  height="26" fill="#30363d" stroke="#484f58"/>
  </g>
  <g font-size="9" fill="#e6edf3" text-anchor="middle">
    <text x="83"  y="89">sense</text>
    <text x="121" y="89">net</text>
    <text x="211" y="89">policy inference</text>
    <text x="306" y="89">act</text>
  </g>
  <rect x="326" y="72" width="54" height="26" fill="none" stroke="#3fb950" stroke-dasharray="3 3"/>
  <text x="353" y="89" fill="#3fb950" font-size="9" text-anchor="middle">slack</text>

  <!-- tail -->
  <text x="20" y="152" fill="#f85149" font-size="11" font-weight="600">p99</text>
  <g>
    <rect x="60"  y="136" width="46"  height="26" fill="#30363d" stroke="#484f58"/>
    <rect x="106" y="136" width="30"  height="26" fill="#30363d" stroke="#484f58"/>
    <rect x="136" y="136" width="320" height="26" fill="#f85149" opacity="0.7"/>
    <rect x="456" y="136" width="40"  height="26" fill="#30363d" stroke="#484f58"/>
  </g>
  <text x="296" y="153" fill="#e6edf3" font-size="9" text-anchor="middle">policy inference (GC pause, cache miss, thermal throttle)</text>
  <text x="476" y="153" fill="#e6edf3" font-size="9" text-anchor="middle">act</text>

  <line x1="380" y1="130" x2="380" y2="176" stroke="#f85149" stroke-width="1.6"/>
  <text x="390" y="182" fill="#f85149" font-size="10">deadline missed &#8594; hold previous action &#8594; delay doubles this cycle</text>

  <line x1="20" y1="212" x2="620" y2="212" stroke="#30363d" stroke-width="1"/>

  <text x="20" y="236" fill="#e6edf3" font-size="11">A pure delay of &#964; costs phase margin at frequency f:  lag = 360 &#183; f &#183; &#964; degrees</text>
  <g fill="#8b949e" font-size="10.5">
    <text x="40" y="256">30 ms at 2 Hz &#8594; 22&#176;   (tolerable)</text>
    <text x="300" y="256">50 ms at 5 Hz &#8594; 90&#176;   (most of your margin)</text>
    <text x="40" y="274">100 ms at 5 Hz &#8594; 180&#176;   (positive feedback: the loop oscillates)</text>
  </g>
  <text x="40" y="292" fill="#3fb950" font-size="10.5">This is why a policy that is fast on average and occasionally slow behaves worse than one that is uniformly slower.</text>
</svg>
