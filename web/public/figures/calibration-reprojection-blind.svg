<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Reprojection error is blind to the degeneracy that ruins a calibration</title>
  <desc>Left: a fronto-parallel board at twice the distance seen with twice the focal length projects to an identical image, so the two parameters cannot be separated. Right: across four capture protocols the RMS reprojection error stays between 0.184 and 0.192 pixels while the recovered focal length is wrong by 650 percent, 446 percent, 1.1 percent and 0.1 percent respectively.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="300" y1="40" x2="300" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">Why fronto-parallel views cannot pin f</text>

  <path d="M32 118 L60 104 L60 132 Z" fill="#1c2128" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="46" y="150" fill="#6c63ff" font-size="9" text-anchor="middle">f</text>
  <line x1="120" y1="92" x2="120" y2="144" stroke="#3fb950" stroke-width="3"/>
  <text x="120" y="160" fill="#3fb950" font-size="9" text-anchor="middle">board at Z</text>
  <line x1="60" y1="104" x2="120" y2="92" stroke="#484f58" stroke-dasharray="2 2"/>
  <line x1="60" y1="132" x2="120" y2="144" stroke="#484f58" stroke-dasharray="2 2"/>

  <path d="M32 216 L60 202 L60 230 Z" fill="#1c2128" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="46" y="248" fill="#6c63ff" font-size="9" text-anchor="middle">2f</text>
  <line x1="242" y1="164" x2="242" y2="268" stroke="#3fb950" stroke-width="3"/>
  <text x="242" y="284" fill="#3fb950" font-size="9" text-anchor="middle">board at 2Z</text>
  <line x1="60" y1="202" x2="242" y2="164" stroke="#484f58" stroke-dasharray="2 2"/>
  <line x1="60" y1="230" x2="242" y2="268" stroke="#484f58" stroke-dasharray="2 2"/>

  <rect x="150" y="96" width="60" height="40" rx="4" fill="#1c2128" stroke="#d29922"/>
  <text x="180" y="113" fill="#d29922" font-size="9" text-anchor="middle">identical</text>
  <text x="180" y="126" fill="#d29922" font-size="9" text-anchor="middle">image</text>
  <text x="20" y="180" fill="#8b949e" font-size="9">Tilt breaks it: foreshortening depends on f and Z</text>
  <text x="20" y="192" fill="#8b949e" font-size="9">differently, so 10° of tilt is already enough.</text>

  <text x="320" y="24" fill="#e6edf3" font-size="12" font-weight="600">Same error metric, wildly different calibration</text>
  <line x1="356" y1="244" x2="626" y2="244" stroke="#30363d"/>
  <line x1="356" y1="62" x2="356" y2="244" stroke="#30363d"/>
  <text x="350" y="86" fill="#8b949e" font-size="8.5" text-anchor="end">1000%</text>
  <text x="350" y="166" fill="#8b949e" font-size="8.5" text-anchor="end">1%</text>
  <text x="350" y="242" fill="#8b949e" font-size="8.5" text-anchor="end">0.1%</text>
  <text x="320" y="48" fill="#8b949e" font-size="9">focal error</text>

  <rect x="372" y="88" width="42" height="156" fill="#f85149"/>
  <text x="393" y="82" fill="#f85149" font-size="9.5" text-anchor="middle">650%</text>
  <rect x="434" y="94" width="42" height="150" fill="#f85149"/>
  <text x="455" y="88" fill="#f85149" font-size="9.5" text-anchor="middle">446%</text>
  <rect x="496" y="198" width="42" height="46" fill="#3fb950"/>
  <text x="517" y="192" fill="#3fb950" font-size="9.5" text-anchor="middle">1.1%</text>
  <rect x="558" y="240" width="42" height="4" fill="#3fb950"/>
  <text x="579" y="234" fill="#3fb950" font-size="9.5" text-anchor="middle">0.1%</text>

  <text x="393" y="258" fill="#8b949e" font-size="8" text-anchor="middle">flat,</text>
  <text x="393" y="267" fill="#8b949e" font-size="8" text-anchor="middle">fixed Z</text>
  <text x="455" y="258" fill="#8b949e" font-size="8" text-anchor="middle">flat,</text>
  <text x="455" y="267" fill="#8b949e" font-size="8" text-anchor="middle">varied Z</text>
  <text x="517" y="258" fill="#8b949e" font-size="8" text-anchor="middle">tilt 10°</text>
  <text x="579" y="258" fill="#8b949e" font-size="8" text-anchor="middle">tilt 35°</text>

  <rect x="356" y="276" width="270" height="18" rx="3" fill="#1c2128" stroke="#30363d"/>
  <text x="491" y="289" fill="#e6edf3" font-size="9" text-anchor="middle">RMS reprojection error: 0.184  0.184  0.192  0.190 px</text>
</svg>
