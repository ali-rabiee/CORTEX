<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="crt crd" font-family="system-ui, -apple-system, sans-serif">
  <title id="crt">What the convolutional prior buys, and how slowly context grows</title>
  <desc id="crd">Left: a three by three convolution mapping 256 channels to 256
    on a 56 by 56 grid uses about 590 thousand parameters, while a dense layer
    over the same activations would use 644 billion — a million-fold difference,
    because the kernel is reused at every position. Right: the receptive field of
    stacked stride-one three by three convolutions grows only linearly, reaching
    21 pixels after ten layers, while striding grows it multiplicatively and
    dilation exponentially.</desc>

  <!-- LEFT: parameter sharing -->
  <text x="20" y="26" fill="#e6edf3" font-size="12" font-weight="600">weight sharing</text>
  <text x="20" y="42" fill="#8b949e" font-size="10">3&#215;3 conv, 256&#8594;256 channels, on a 56&#215;56 grid</text>

  <rect x="24" y="58" width="250" height="30" rx="5" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="149" y="78" fill="#3fb950" font-size="11" text-anchor="middle">convolution: 589,824 parameters</text>

  <rect x="24" y="98" width="250" height="30" rx="5" fill="#1c2128" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="149" y="118" fill="#f85149" font-size="11" text-anchor="middle">dense equivalent: 644,513,529,856</text>

  <text x="24" y="148" fill="#8b949e" font-size="10.5">a factor of about 10&#8310;, because the same kernel</text>
  <text x="24" y="163" fill="#8b949e" font-size="10.5">is applied at every position rather than learned</text>
  <text x="24" y="178" fill="#8b949e" font-size="10.5">separately for each one</text>

  <text x="24" y="206" fill="#6c63ff" font-size="10.5">that reuse IS the prior: it asserts a feature means</text>
  <text x="24" y="221" fill="#6c63ff" font-size="10.5">the same thing wherever it appears</text>

  <line x1="300" y1="20" x2="300" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- RIGHT: receptive field -->
  <text x="322" y="26" fill="#e6edf3" font-size="12" font-weight="600">receptive field after N layers of 3&#215;3</text>

  <g font-size="10.5" fill="#8b949e">
    <text x="326" y="52">layers</text>
    <text x="404" y="52" fill="#f85149">stride 1</text>
    <text x="480" y="52" fill="#d29922">stride 2 alt.</text>
    <text x="568" y="52" fill="#3fb950">dilated</text>
  </g>
  <line x1="322" y1="60" x2="614" y2="60" stroke="#30363d"/>

  <g font-size="10.5" fill="#e6edf3">
    <text x="326" y="82">2</text>   <text x="404" y="82">5</text>   <text x="480" y="82">5</text>    <text x="568" y="82">7</text>
    <text x="326" y="106">4</text>  <text x="404" y="106">9</text>  <text x="480" y="106">13</text>  <text x="568" y="106">31</text>
    <text x="326" y="130">6</text>  <text x="404" y="130">13</text> <text x="480" y="130">29</text>  <text x="568" y="130">127</text>
    <text x="326" y="154">8</text>  <text x="404" y="154">17</text> <text x="480" y="154">61</text>  <text x="568" y="154">511</text>
    <text x="326" y="178">10</text> <text x="404" y="178">21</text> <text x="480" y="178">125</text> <text x="568" y="178">2047</text>
  </g>

  <text x="322" y="206" fill="#f85149" font-size="10.5">linear in depth &#8212; 10 layers see only 21 px</text>
  <text x="322" y="222" fill="#d29922" font-size="10.5">striding: multiplicative, at the cost of resolution</text>
  <text x="322" y="238" fill="#3fb950" font-size="10.5">dilation: exponential, at full resolution</text>

  <line x1="20" y1="256" x2="616" y2="256" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="278" fill="#e6edf3" font-size="11">Locality is cheap and it is also a constraint: context has to be bought back explicitly.</text>
  <text x="20" y="293" fill="#8b949e" font-size="10.5">A network that needs to relate two distant regions must be deep, strided, or dilated &#8212; attention gets there in one layer.</text>
</svg>
