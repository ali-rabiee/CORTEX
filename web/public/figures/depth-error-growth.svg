<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="det ded" font-family="system-ui, -apple-system, sans-serif">
  <title id="det">Stereo depth error grows with the square of distance</title>
  <desc id="ded">Depth from disparity is focal length times baseline over
    disparity, so the depth error is proportional to depth squared divided by
    focal length times baseline. For a typical rig with a six-centimetre
    baseline and quarter-pixel disparity accuracy, the depth error is under a
    centimetre at one metre and about seventy centimetres at ten metres — a
    hundredfold growth over a tenfold distance.</desc>

  <text x="20" y="26" fill="#e6edf3" font-size="12">z = fB/d  &#8658;  &#948;z = z&#178;&#183;&#948;d / (fB)</text>
  <text x="20" y="42" fill="#8b949e" font-size="10.5">f = 600 px, baseline B = 6 cm, disparity accuracy &#948;d = 0.25 px</text>

  <line x1="70" y1="230" x2="380" y2="230" stroke="#484f58" stroke-width="1.2"/>
  <line x1="70" y1="230" x2="70" y2="62" stroke="#484f58" stroke-width="1.2"/>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="70"  y="246">0.5</text>
    <text x="132" y="246">1</text>
    <text x="194" y="246">2</text>
    <text x="256" y="246">3</text>
    <text x="318" y="246">5</text>
    <text x="380" y="246">10 m</text>
  </g>
  <text x="225" y="266" fill="#8b949e" font-size="10.5" text-anchor="middle">true depth</text>
  <text x="60" y="66" fill="#8b949e" font-size="9.5" text-anchor="end">70 cm</text>
  <text x="60" y="234" fill="#8b949e" font-size="9.5" text-anchor="end">0</text>

  <path d="M 70 229 L 132 228 L 194 223 L 256 214 L 318 187 L 380 66"
        fill="none" stroke="#f85149" stroke-width="2.6"/>
  <g fill="#f85149">
    <circle cx="70" cy="229" r="3"/><circle cx="132" cy="228" r="3"/>
    <circle cx="194" cy="223" r="3"/><circle cx="256" cy="214" r="3"/>
    <circle cx="318" cy="187" r="3"/><circle cx="380" cy="66" r="3"/>
  </g>
  <text x="330" y="96" fill="#f85149" font-size="10.5" text-anchor="end">quadratic</text>

  <line x1="410" y1="20" x2="410" y2="284" stroke="#30363d" stroke-width="1"/>

  <g font-size="10.5" fill="#8b949e">
    <text x="428" y="52">depth</text>
    <text x="500" y="52">error</text>
    <text x="566" y="52">relative</text>
  </g>
  <line x1="424" y1="60" x2="614" y2="60" stroke="#30363d"/>
  <g font-size="10.5" fill="#e6edf3">
    <text x="428" y="82">0.5 m</text>  <text x="500" y="82">0.2 cm</text>  <text x="566" y="82">0.3%</text>
    <text x="428" y="104">1 m</text>   <text x="500" y="104">0.7 cm</text> <text x="566" y="104">0.7%</text>
    <text x="428" y="126">2 m</text>   <text x="500" y="126">2.8 cm</text> <text x="566" y="126">1.4%</text>
    <text x="428" y="148">3 m</text>   <text x="500" y="148">6.2 cm</text> <text x="566" y="148">2.1%</text>
    <text x="428" y="170">5 m</text>   <text x="500" y="170">17 cm</text>  <text x="566" y="170">3.5%</text>
    <text x="428" y="192">10 m</text>  <text x="500" y="192">69 cm</text>  <text x="566" y="192">6.9%</text>
  </g>

  <text x="424" y="222" fill="#3fb950" font-size="10.5">tabletop manipulation lives here &#8212; sub-cm</text>
  <text x="424" y="240" fill="#f85149" font-size="10.5">navigation does not &#8212; and the spec must say</text>
  <text x="424" y="254" fill="#f85149" font-size="10.5">at what range</text>

  <text x="20" y="288" fill="#8b949e" font-size="10.5">&#8220;Accurate to a centimetre&#8221; is not a specification. It is a specification at one distance.</text>
</svg>
