<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="pbt pbd" font-family="system-ui, -apple-system, sans-serif">
  <title id="pbt">Why a baseline reduces policy-gradient variance</title>
  <desc id="pbd">Three sampled trajectories score 95, 100 and 105. Without a
    baseline every trajectory gets a large positive weight, so all three are
    pushed up and the useful signal — which one was better — is a small
    difference between large numbers. Subtracting the mean leaves weights of
    minus five, zero and plus five, so the worse trajectory is actively pushed
    down and the signal is the whole of the number.</desc>

  <defs>
    <marker id="pbu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
    <marker id="pbd2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker>
  </defs>

  <text x="20" y="26" fill="#e6edf3" font-size="12.5">Three sampled trajectories, returns 95 / 100 / 105</text>

  <!-- ===== left: no baseline ===== -->
  <text x="20" y="60" fill="#f85149" font-size="12.5" font-weight="600">weight = G</text>

  <g font-size="11" fill="#8b949e" text-anchor="end">
    <text x="86" y="106">&#964;&#8321;  G=95</text>
    <text x="86" y="156">&#964;&#8322;  G=100</text>
    <text x="86" y="206">&#964;&#8323;  G=105</text>
  </g>

  <line x1="98" y1="200" x2="98" y2="86" stroke="#30363d" stroke-width="1"/>
  <g stroke="#3fb950" stroke-width="9" marker-end="url(#pbu)" opacity="0.85">
    <line x1="98" y1="102" x2="222" y2="102"/>
    <line x1="98" y1="152" x2="228" y2="152"/>
    <line x1="98" y1="202" x2="234" y2="202"/>
  </g>
  <g fill="#3fb950" font-size="10.5">
    <text x="240" y="106">&#8593; 95</text>
    <text x="246" y="156">&#8593; 100</text>
    <text x="252" y="206">&#8593; 105</text>
  </g>

  <text x="160" y="242" fill="#f85149" font-size="11" text-anchor="middle">every trajectory is pushed up hard;</text>
  <text x="160" y="258" fill="#f85149" font-size="11" text-anchor="middle">the useful signal is a 5% difference</text>
  <text x="160" y="274" fill="#f85149" font-size="11" text-anchor="middle">between three large numbers</text>

  <line x1="320" y1="44" x2="320" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- ===== right: with baseline ===== -->
  <text x="342" y="60" fill="#3fb950" font-size="12.5" font-weight="600">weight = G &#8722; b(s),  b = 100</text>

  <g font-size="11" fill="#8b949e" text-anchor="end">
    <text x="418" y="106">&#964;&#8321;  &#8722;5</text>
    <text x="418" y="156">&#964;&#8322;   0</text>
    <text x="418" y="206">&#964;&#8323;  +5</text>
  </g>

  <line x1="470" y1="200" x2="470" y2="86" stroke="#484f58" stroke-width="1.4"/>
  <text x="470" y="80" fill="#8b949e" font-size="10" text-anchor="middle">0</text>

  <line x1="470" y1="102" x2="410" y2="102" stroke="#f85149" stroke-width="9"
        marker-end="url(#pbd2)" opacity="0.85"/>
  <circle cx="470" cy="152" r="4" fill="#8b949e"/>
  <line x1="470" y1="202" x2="530" y2="202" stroke="#3fb950" stroke-width="9"
        marker-end="url(#pbu)" opacity="0.85"/>

  <g font-size="10.5">
    <text x="386" y="106" fill="#f85149" text-anchor="end">&#8595;</text>
    <text x="484" y="156" fill="#8b949e">no update</text>
    <text x="546" y="206" fill="#3fb950">&#8593;</text>
  </g>

  <text x="480" y="242" fill="#3fb950" font-size="11" text-anchor="middle">worse-than-average is pushed down,</text>
  <text x="480" y="258" fill="#3fb950" font-size="11" text-anchor="middle">better-than-average up &#8212; the signal is</text>
  <text x="480" y="274" fill="#3fb950" font-size="11" text-anchor="middle">the whole of the weight, not 5% of it</text>
</svg>
