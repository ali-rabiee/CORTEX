<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="mmt mmd" font-family="system-ui, -apple-system, sans-serif">
  <title id="mmt">The Markov property is a property of your state variable, not of the world</title>
  <desc id="mmd">On the left, the state is a single camera frame showing a ball
    between two paddles. Two different histories produce the identical frame but
    demand opposite actions, so the same state maps to two different optimal
    actions and the process is not Markov. On the right, the state is two stacked
    frames, which reveals the velocity; each state now determines one optimal
    action.</desc>

  <!-- ===== LEFT: not Markov ===== -->
  <text x="20" y="26" fill="#f85149" font-size="13" font-weight="600">state = one frame</text>
  <text x="20" y="44" fill="#8b949e" font-size="11">not Markov</text>

  <rect x="40" y="60" width="200" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <line x1="60" y1="70" x2="60" y2="146" stroke="#484f58" stroke-width="3"/>
  <line x1="220" y1="70" x2="220" y2="146" stroke="#484f58" stroke-width="3"/>
  <circle cx="140" cy="108" r="9" fill="#e6edf3"/>
  <text x="140" y="176" fill="#8b949e" font-size="11" text-anchor="middle">observation o&#8348;</text>

  <g stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M 140 200 L 96 200"/>
    <path d="M 140 200 L 184 200"/>
  </g>
  <text x="140" y="196" fill="#8b949e" font-size="10.5" text-anchor="middle">consistent with</text>

  <text x="88" y="224" fill="#d29922" font-size="11" text-anchor="middle">ball moving left</text>
  <text x="88" y="240" fill="#3fb950" font-size="11" text-anchor="middle">&#8594; move left</text>

  <text x="192" y="224" fill="#d29922" font-size="11" text-anchor="middle">ball moving right</text>
  <text x="192" y="240" fill="#3fb950" font-size="11" text-anchor="middle">&#8594; move right</text>

  <text x="140" y="272" fill="#f85149" font-size="11.5" text-anchor="middle">one state, two opposite optimal actions</text>
  <text x="140" y="288" fill="#f85149" font-size="11.5" text-anchor="middle">&#8212; no policy &#960;(a | s) can be optimal</text>

  <line x1="300" y1="20" x2="300" y2="280" stroke="#30363d" stroke-width="1"/>

  <!-- ===== RIGHT: Markov after augmentation ===== -->
  <text x="330" y="26" fill="#3fb950" font-size="13" font-weight="600">state = two frames</text>
  <text x="330" y="44" fill="#8b949e" font-size="11">Markov &#8212; velocity is recoverable</text>

  <rect x="340" y="60" width="128" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <line x1="352" y1="70" x2="352" y2="146" stroke="#484f58" stroke-width="3"/>
  <line x1="456" y1="70" x2="456" y2="146" stroke="#484f58" stroke-width="3"/>
  <circle cx="416" cy="108" r="8" fill="#8b949e"/>
  <text x="404" y="176" fill="#8b949e" font-size="10.5" text-anchor="middle">o&#8348;&#8331;&#8321;</text>

  <rect x="492" y="60" width="128" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <line x1="504" y1="70" x2="504" y2="146" stroke="#484f58" stroke-width="3"/>
  <line x1="608" y1="70" x2="608" y2="146" stroke="#484f58" stroke-width="3"/>
  <circle cx="540" cy="108" r="8" fill="#e6edf3"/>
  <text x="556" y="176" fill="#8b949e" font-size="10.5" text-anchor="middle">o&#8348;</text>

  <path d="M 424 200 L 540 200" stroke="#3fb950" stroke-width="2" fill="none"/>
  <text x="482" y="194" fill="#3fb950" font-size="10.5" text-anchor="middle">the ball moved left</text>

  <text x="482" y="228" fill="#3fb950" font-size="11.5" text-anchor="middle">s&#8348; = (o&#8348;&#8331;&#8321;, o&#8348;) determines one optimal action</text>
  <text x="482" y="264" fill="#8b949e" font-size="11" text-anchor="middle">Nothing about the world changed.</text>
  <text x="482" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Only what you chose to call the state.</text>
</svg>
