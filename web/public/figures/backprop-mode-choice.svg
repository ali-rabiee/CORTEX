<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="bmt bmd" font-family="system-ui, -apple-system, sans-serif">
  <title id="bmt">Why reverse mode, and what it costs</title>
  <desc id="bmd">The chain rule can be evaluated in either associative order.
    Forward mode propagates derivatives with respect to one input at a time, so
    getting all gradients of a scalar loss costs one pass per parameter. Reverse
    mode propagates derivatives of one output backwards, so a scalar loss gives
    every gradient in a single pass. The price is that every intermediate
    activation must be kept until the backward pass reaches it.</desc>

  <!-- forward mode -->
  <text x="20" y="26" fill="#f85149" font-size="12" font-weight="600">forward mode: one pass per input</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="24" y="46" width="46" height="26" rx="4"/>
    <rect x="94" y="46" width="46" height="26" rx="4"/>
    <rect x="164" y="46" width="46" height="26" rx="4"/>
    <rect x="234" y="46" width="46" height="26" rx="4"/>
  </g>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="47" y="63">x</text><text x="117" y="63">h&#8321;</text>
    <text x="187" y="63">h&#8322;</text><text x="257" y="63">L</text>
  </g>
  <g stroke="#f85149" stroke-width="1.8" fill="none">
    <path d="M 70 59 L 90 59"/><path d="M 140 59 L 160 59"/><path d="M 210 59 L 230 59"/>
  </g>
  <text x="20" y="92" fill="#8b949e" font-size="10">carries d(everything)/dx&#7522; forward &#8212; one direction of input at a time</text>

  <g font-size="10.5" fill="#8b949e">
    <text x="24" y="118">10&#8310; parameters</text>
    <text x="150" y="118" fill="#f85149">10&#8310; passes</text>
  </g>

  <line x1="20" y1="136" x2="616" y2="136" stroke="#30363d" stroke-width="1"/>

  <!-- reverse mode -->
  <text x="20" y="160" fill="#3fb950" font-size="12" font-weight="600">reverse mode: one pass per output</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="24" y="180" width="46" height="26" rx="4"/>
    <rect x="94" y="180" width="46" height="26" rx="4"/>
    <rect x="164" y="180" width="46" height="26" rx="4"/>
    <rect x="234" y="180" width="46" height="26" rx="4"/>
  </g>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="47" y="197">x</text><text x="117" y="197">h&#8321;</text>
    <text x="187" y="197">h&#8322;</text><text x="257" y="197">L</text>
  </g>
  <g stroke="#3fb950" stroke-width="1.8" fill="none">
    <path d="M 230 210 L 210 210"/><path d="M 160 210 L 140 210"/><path d="M 90 210 L 70 210"/>
  </g>
  <text x="20" y="230" fill="#8b949e" font-size="10">carries dL/d(everything) backward &#8212; one scalar output, so one pass</text>

  <g font-size="10.5" fill="#8b949e">
    <text x="24" y="254">10&#8310; parameters</text>
    <text x="150" y="254" fill="#3fb950">1 pass</text>
  </g>
  <text x="20" y="276" fill="#d29922" font-size="10.5">the price: every h&#7522; must be kept until the backward pass reaches it</text>
  <text x="20" y="292" fill="#8b949e" font-size="10">which is why activation memory, not parameters, caps your batch size</text>

  <line x1="330" y1="146" x2="330" y2="292" stroke="#30363d" stroke-width="1"/>

  <!-- checkpointing table -->
  <text x="352" y="166" fill="#e6edf3" font-size="11.5" font-weight="600">checkpointing: store every &#8730;L-th</text>
  <text x="352" y="182" fill="#8b949e" font-size="10">recompute the rest &#8212; one extra forward pass</text>

  <g font-size="10.5" fill="#8b949e">
    <text x="356" y="206">layers</text>
    <text x="430" y="206">stored</text>
    <text x="510" y="206">memory</text>
  </g>
  <line x1="352" y1="214" x2="608" y2="214" stroke="#30363d"/>
  <g font-size="10.5" fill="#e6edf3">
    <text x="356" y="234">12</text>  <text x="430" y="234">7</text>   <text x="510" y="234">58%</text>
    <text x="356" y="254">32</text>  <text x="430" y="254">11</text>  <text x="510" y="254">35%</text>
    <text x="356" y="274">96</text>  <text x="430" y="274">20</text>  <text x="510" y="274">20%</text>
  </g>
  <text x="352" y="294" fill="#3fb950" font-size="10">exact &#8212; nothing is approximated</text>
</svg>
