<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="rdt rdd" font-family="system-ui, -apple-system, sans-serif">
  <title id="rdt">The data pyramid a robotic foundation model is built on</title>
  <desc id="rdd">Three tiers of very different size. Web image-text pairs number
    in the hundreds of millions and carry semantics but no actions. Egocentric
    human video numbers in the thousands of hours and carries physical
    interaction but no robot action labels. Robot demonstrations number in the
    tens to hundreds of thousands and are the only tier with actions. The
    strategy of a robotic foundation model is to take semantics from the wide
    tier and motor skill from the narrow one.</desc>

  <!-- tiers -->
  <path d="M 40 76 L 600 76 L 540 130 L 100 130 Z" fill="#6c63ff" opacity="0.20" stroke="#6c63ff" stroke-opacity="0.5"/>
  <path d="M 100 134 L 540 134 L 452 186 L 188 186 Z" fill="#d29922" opacity="0.18" stroke="#d29922" stroke-opacity="0.5"/>
  <path d="M 188 190 L 452 190 L 392 242 L 248 242 Z" fill="#3fb950" opacity="0.20" stroke="#3fb950" stroke-opacity="0.6"/>

  <text x="320" y="98" fill="#e6edf3" font-size="11.5" text-anchor="middle">web image&#8211;text pairs</text>
  <text x="320" y="116" fill="#8b949e" font-size="10" text-anchor="middle">400 million (CLIP) &#183; semantics, no actions</text>

  <text x="320" y="156" fill="#e6edf3" font-size="11.5" text-anchor="middle">egocentric human video</text>
  <text x="320" y="174" fill="#8b949e" font-size="10" text-anchor="middle">3,000 hours (Ego4D) &#183; interaction, no action labels</text>

  <text x="320" y="212" fill="#e6edf3" font-size="11.5" text-anchor="middle">robot demonstrations</text>
  <text x="320" y="230" fill="#8b949e" font-size="10" text-anchor="middle">76k (DROID) &#183; 130k (RT-1) &#183; the only tier with actions</text>

  <!-- annotations -->
  <text x="24" y="52" fill="#8b949e" font-size="10.5">free, already collected</text>
  <text x="24" y="66" fill="#484f58" font-size="9.5">costs a crawl</text>

  <text x="616" y="252" fill="#8b949e" font-size="10.5" text-anchor="end">a robot, an operator, and wall-clock time per sample</text>

  <line x1="614" y1="76" x2="614" y2="242" stroke="#484f58" stroke-width="1"/>
  <line x1="610" y1="76" x2="618" y2="76" stroke="#484f58" stroke-width="1"/>
  <line x1="610" y1="242" x2="618" y2="242" stroke="#484f58" stroke-width="1"/>
  <text x="628" y="164" fill="#8b949e" font-size="10" transform="rotate(-90 628 164)" text-anchor="middle">~4 orders of magnitude</text>

  <text x="320" y="274" fill="#e6edf3" font-size="11.5" text-anchor="middle">The bet: take semantics from the top and motor skill from the bottom.</text>
  <text x="320" y="290" fill="#8b949e" font-size="10.5" text-anchor="middle">Robot data will never reach web scale, so the question is what can be borrowed rather than collected.</text>
</svg>
