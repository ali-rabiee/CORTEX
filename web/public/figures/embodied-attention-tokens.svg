<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="eat ead" font-family="system-ui, -apple-system, sans-serif">
  <title id="eat">Heterogeneous robot inputs become one token sequence</title>
  <desc id="ead">Patches from two cameras, a proprioception vector, and the words
    of an instruction are each projected into the same embedding space and
    concatenated into a single sequence, together with learned action queries.
    An action query attends across all of them at once, so the weight it places
    on a wrist-camera patch and on the word "cup" is decided by content rather
    than by a hand-designed fusion rule.</desc>

  <defs>
    <marker id="eaa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/></marker>
  </defs>

  <!-- sources -->
  <g font-size="10" fill="#8b949e" text-anchor="end">
    <text x="76" y="62">overhead cam</text>
    <text x="76" y="96">wrist cam</text>
    <text x="76" y="130">proprioception</text>
    <text x="76" y="164">instruction</text>
    <text x="76" y="200">action queries</text>
  </g>

  <!-- token rows -->
  <g stroke="#30363d">
    <g fill="#1c2128">
      <rect x="88" y="48" width="24" height="20" rx="3"/><rect x="116" y="48" width="24" height="20" rx="3"/>
      <rect x="144" y="48" width="24" height="20" rx="3"/><rect x="172" y="48" width="24" height="20" rx="3"/>
      <rect x="88" y="82" width="24" height="20" rx="3"/><rect x="116" y="82" width="24" height="20" rx="3"/>
      <rect x="144" y="82" width="24" height="20" rx="3"/><rect x="172" y="82" width="24" height="20" rx="3"/>
      <rect x="88" y="116" width="24" height="20" rx="3"/><rect x="116" y="116" width="24" height="20" rx="3"/>
    </g>
    <g fill="#1c2128">
      <rect x="88" y="150" width="34" height="20" rx="3"/><rect x="126" y="150" width="34" height="20" rx="3"/>
      <rect x="164" y="150" width="34" height="20" rx="3"/>
    </g>
    <g fill="#1c2128" stroke="#3fb950" stroke-opacity="0.55">
      <rect x="88" y="186" width="24" height="20" rx="3"/><rect x="116" y="186" width="24" height="20" rx="3"/>
      <rect x="144" y="186" width="24" height="20" rx="3"/>
    </g>
  </g>
  <g font-size="8.5" fill="#8b949e" text-anchor="middle">
    <text x="105" y="164">put</text><text x="143" y="164">the</text><text x="181" y="164">cup</text>
  </g>
  <text x="130" y="222" fill="#3fb950" font-size="9.5" text-anchor="middle">learned, one per predicted action</text>

  <text x="142" y="30" fill="#8b949e" font-size="10.5" text-anchor="middle">each projected to the same d-dim embedding</text>

  <!-- arrow into sequence -->
  <line x1="210" y1="124" x2="248" y2="124" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#eaa)"/>

  <!-- unified sequence -->
  <rect x="256" y="40" width="60" height="220" rx="7" fill="#1c2128" stroke="#6c63ff" stroke-opacity="0.6"/>
  <text x="286" y="140" fill="#e6edf3" font-size="11" text-anchor="middle" transform="rotate(-90 286 140)">one token sequence</text>

  <line x1="322" y1="124" x2="356" y2="124" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#eaa)"/>

  <!-- attention view -->
  <rect x="364" y="40" width="252" height="220" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="490" y="62" fill="#e6edf3" font-size="11" text-anchor="middle">one action query, attending</text>

  <circle cx="490" cy="228" r="13" fill="#1c2128" stroke="#3fb950" stroke-width="1.6"/>
  <text x="490" y="232" fill="#3fb950" font-size="9.5" text-anchor="middle">q</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="386" y="84" width="26" height="18" rx="3"/>
    <rect x="424" y="84" width="26" height="18" rx="3"/>
    <rect x="462" y="84" width="26" height="18" rx="3"/>
    <rect x="500" y="84" width="26" height="18" rx="3"/>
    <rect x="538" y="84" width="26" height="18" rx="3"/>
    <rect x="576" y="84" width="26" height="18" rx="3"/>
    <rect x="424" y="134" width="34" height="18" rx="3"/>
    <rect x="472" y="134" width="34" height="18" rx="3"/>
    <rect x="520" y="134" width="34" height="18" rx="3"/>
  </g>
  <text x="399" y="76" fill="#8b949e" font-size="8.5" text-anchor="middle">image patches</text>
  <text x="490" y="126" fill="#8b949e" font-size="8.5" text-anchor="middle">words</text>

  <g stroke="#6c63ff" fill="none">
    <path d="M 486 215 L 437 104" stroke-width="4.5" opacity="0.85"/>
    <path d="M 490 215 L 550 104" stroke-width="1" opacity="0.25"/>
    <path d="M 484 215 L 401 104" stroke-width="1" opacity="0.22"/>
    <path d="M 494 215 L 589 104" stroke-width="1" opacity="0.2"/>
    <path d="M 492 215 L 537 154" stroke-width="4" opacity="0.8"/>
    <path d="M 488 215 L 441 154" stroke-width="1" opacity="0.25"/>
  </g>

  <text x="490" y="256" fill="#8b949e" font-size="10" text-anchor="middle">thickness = attention weight, decided by content</text>
  <text x="490" y="272" fill="#8b949e" font-size="10" text-anchor="middle">not by a hand-designed fusion rule</text>
</svg>
