<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="trt trd" font-family="system-ui, -apple-system, sans-serif">
  <title id="trt">The residual stream, and where the norm goes</title>
  <desc id="trd">A transformer block is best read as a residual stream that runs
    unobstructed from input to output, with attention and the feed-forward block
    reading from it and writing back. In the pre-norm arrangement the
    normalisation sits inside each branch, so the stream itself is never
    normalised and the gradient has an identity path from the loss to every
    layer. In the post-norm arrangement the normalisation sits on the stream, so
    every layer's gradient passes through it and depth requires a warmup.</desc>

  <defs>
    <marker id="tra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/></marker>
  </defs>

  <!-- PRE-NORM -->
  <text x="20" y="26" fill="#3fb950" font-size="12" font-weight="600">pre-norm: the stream is untouched</text>

  <line x1="60" y1="52" x2="60" y2="252" stroke="#6c63ff" stroke-width="5" opacity="0.85"/>
  <text x="34" y="152" fill="#6c63ff" font-size="10.5" transform="rotate(-90 34 152)" text-anchor="middle">residual stream</text>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="104" y="66" width="52" height="22" rx="4"/>
    <rect x="164" y="60" width="76" height="34" rx="5"/>
    <rect x="104" y="176" width="52" height="22" rx="4"/>
    <rect x="164" y="170" width="76" height="34" rx="5"/>
  </g>
  <g fill="#e6edf3" font-size="10" text-anchor="middle">
    <text x="130" y="81">norm</text>
    <text x="202" y="81">attention</text>
    <text x="130" y="191">norm</text>
    <text x="202" y="191">FFN</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.3" fill="none">
    <path d="M 60 77 L 100 77" marker-end="url(#tra)"/>
    <path d="M 240 77 C 262 77, 262 118, 64 118" marker-end="url(#tra)"/>
    <path d="M 60 187 L 100 187" marker-end="url(#tra)"/>
    <path d="M 240 187 C 262 187, 262 228, 64 228" marker-end="url(#tra)"/>
  </g>
  <circle cx="60" cy="118" r="6" fill="#1c2128" stroke="#6c63ff"/>
  <text x="60" y="122" fill="#6c63ff" font-size="9" text-anchor="middle">+</text>
  <circle cx="60" cy="228" r="6" fill="#1c2128" stroke="#6c63ff"/>
  <text x="60" y="232" fill="#6c63ff" font-size="9" text-anchor="middle">+</text>

  <text x="20" y="274" fill="#3fb950" font-size="10.5">identity path from loss to every layer &#8212; trains at depth with no warmup</text>
  <text x="20" y="290" fill="#8b949e" font-size="10">cost: the stream&#8217;s variance grows with depth, so a final norm is needed</text>

  <line x1="320" y1="20" x2="320" y2="292" stroke="#30363d" stroke-width="1"/>

  <!-- POST-NORM -->
  <text x="342" y="26" fill="#f85149" font-size="12" font-weight="600">post-norm: the norm is on the stream</text>

  <line x1="382" y1="52" x2="382" y2="252" stroke="#6c63ff" stroke-width="5" opacity="0.4"/>

  <g fill="#1c2128" stroke="#30363d">
    <rect x="426" y="60" width="76" height="34" rx="5"/>
    <rect x="426" y="170" width="76" height="34" rx="5"/>
  </g>
  <g fill="#e6edf3" font-size="10" text-anchor="middle">
    <text x="464" y="81">attention</text>
    <text x="464" y="191">FFN</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.3" fill="none">
    <path d="M 382 77 L 422 77" marker-end="url(#tra)"/>
    <path d="M 502 77 C 524 77, 524 112, 390 112" marker-end="url(#tra)"/>
    <path d="M 382 187 L 422 187" marker-end="url(#tra)"/>
    <path d="M 502 187 C 524 187, 524 222, 390 222" marker-end="url(#tra)"/>
  </g>
  <circle cx="382" cy="112" r="6" fill="#1c2128" stroke="#6c63ff"/>
  <text x="382" y="116" fill="#6c63ff" font-size="9" text-anchor="middle">+</text>
  <rect x="356" y="126" width="52" height="20" rx="4" fill="#1c2128" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="382" y="140" fill="#f85149" font-size="10" text-anchor="middle">norm</text>
  <circle cx="382" cy="222" r="6" fill="#1c2128" stroke="#6c63ff"/>
  <text x="382" y="226" fill="#6c63ff" font-size="9" text-anchor="middle">+</text>
  <rect x="356" y="236" width="52" height="20" rx="4" fill="#1c2128" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="382" y="250" fill="#f85149" font-size="10" text-anchor="middle">norm</text>

  <text x="342" y="274" fill="#f85149" font-size="10.5">every layer&#8217;s gradient passes through L norms &#8212; needs a warmup at depth</text>
  <text x="342" y="290" fill="#8b949e" font-size="10">the original formulation; copying it is a reliable way to lose a day</text>
</svg>
