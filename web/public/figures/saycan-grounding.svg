<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="sct scd" font-family="system-ui, -apple-system, sans-serif">
  <title id="sct">Grounding a language model's plan in what the robot can actually do</title>
  <desc id="scd">For the instruction "I spilled my drink, can you help", the
    language model scores candidate skills by how useful they sound, and a value
    function scores the same skills by how likely the robot is to succeed from
    the current state. Multiplying the two rejects the skill that sounds
    excellent but is not executable here, and selects the one that is both
    sensible and feasible.</desc>

  <text x="20" y="28" fill="#e6edf3" font-size="12">&#8220;I spilled my drink, can you help?&#8221;</text>

  <!-- column headers -->
  <text x="286" y="62" fill="#6c63ff" font-size="10.5" text-anchor="middle">LLM: how useful</text>
  <text x="286" y="75" fill="#8b949e" font-size="9.5" text-anchor="middle">does this sound?</text>
  <text x="404" y="62" fill="#d29922" font-size="10.5" text-anchor="middle">value fn: can I do it</text>
  <text x="404" y="75" fill="#8b949e" font-size="9.5" text-anchor="middle">from here?</text>
  <text x="520" y="62" fill="#3fb950" font-size="10.5" text-anchor="middle">product</text>

  <g font-size="10.5" fill="#8b949e" text-anchor="end">
    <text x="228" y="106">find a sponge</text>
    <text x="228" y="146">bring a vacuum cleaner</text>
    <text x="228" y="186">pick up the cup</text>
    <text x="228" y="226">go to the kitchen</text>
  </g>

  <!-- bars: LLM -->
  <g fill="#6c63ff" opacity="0.85">
    <rect x="240" y="94"  width="86" height="16"/>
    <rect x="240" y="134" width="92" height="16"/>
    <rect x="240" y="174" width="44" height="16"/>
    <rect x="240" y="214" width="58" height="16"/>
  </g>
  <!-- bars: affordance -->
  <g fill="#d29922" opacity="0.85">
    <rect x="358" y="94"  width="76" height="16"/>
    <rect x="358" y="134" width="8"  height="16"/>
    <rect x="358" y="174" width="82" height="16"/>
    <rect x="358" y="214" width="70" height="16"/>
  </g>
  <!-- bars: product -->
  <g fill="#3fb950" opacity="0.85">
    <rect x="476" y="94"  width="80" height="16"/>
    <rect x="476" y="134" width="4"  height="16"/>
    <rect x="476" y="174" width="30" height="16"/>
    <rect x="476" y="214" width="34" height="16"/>
  </g>

  <rect x="234" y="88" width="330" height="28" rx="4" fill="none" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="576" y="106" fill="#3fb950" font-size="10.5">selected</text>

  <text x="576" y="146" fill="#f85149" font-size="10">no vacuum here</text>

  <line x1="20" y1="252" x2="620" y2="252" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="274" fill="#8b949e" font-size="11" text-anchor="middle">The language model knows what would help. It has no idea what this robot, in this room, can do.</text>
  <text x="320" y="290" fill="#e6edf3" font-size="11" text-anchor="middle">Grounding is supplying the second factor &#8212; and it must come from the robot, not from more prompting.</text>
</svg>
