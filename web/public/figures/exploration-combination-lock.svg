<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="ect ecd" font-family="system-ui, -apple-system, sans-serif">
  <title id="ect">Why undirected exploration fails on a chain, and what directed exploration changes</title>
  <desc id="ecd">A chain of N states where exactly one of K actions advances and
    every other action returns you to the start. Random action selection must
    guess correctly N times in a row, so the expected number of attempts grows
    like K to the power N. Directed exploration instead assigns each state an
    uncertainty bonus, so the value of reaching unvisited states propagates
    backwards and the agent is pulled forward deliberately.</desc>

  <defs>
    <marker id="ecf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
    <marker id="ecr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker>
  </defs>

  <text x="20" y="26" fill="#e6edf3" font-size="12.5">a chain: one of K actions advances, the rest reset you to s&#8320;</text>

  <g fill="#1c2128" stroke="#30363d">
    <circle cx="70"  cy="92" r="20"/>
    <circle cx="180" cy="92" r="20"/>
    <circle cx="290" cy="92" r="20"/>
    <circle cx="400" cy="92" r="20"/>
    <circle cx="540" cy="92" r="22" stroke="#3fb950" stroke-opacity="0.7"/>
  </g>
  <g fill="#e6edf3" font-size="11" text-anchor="middle">
    <text x="70"  y="96">s&#8320;</text>
    <text x="180" y="96">s&#8321;</text>
    <text x="290" y="96">s&#8322;</text>
    <text x="400" y="96">s&#8323;</text>
    <text x="540" y="96">s&#8358;</text>
  </g>
  <text x="470" y="96" fill="#8b949e" font-size="13" text-anchor="middle">&#8230;</text>
  <text x="540" y="134" fill="#3fb950" font-size="10.5" text-anchor="middle">the only reward</text>

  <g stroke="#3fb950" stroke-width="1.8" marker-end="url(#ecf)" fill="none">
    <line x1="92"  y1="92" x2="156" y2="92"/>
    <line x1="202" y1="92" x2="266" y2="92"/>
    <line x1="312" y1="92" x2="376" y2="92"/>
    <line x1="422" y1="92" x2="446" y2="92"/>
    <line x1="492" y1="92" x2="514" y2="92"/>
  </g>
  <text x="180" y="74" fill="#3fb950" font-size="9.5" text-anchor="middle">1 action of K</text>

  <g stroke="#f85149" stroke-width="1.3" fill="none" marker-end="url(#ecr)" opacity="0.8">
    <path d="M 180 112 C 150 148, 100 148, 72 114"/>
    <path d="M 290 112 C 230 168, 120 168, 74 116"/>
    <path d="M 400 112 C 300 188, 130 188, 76 118"/>
  </g>
  <text x="250" y="184" fill="#f85149" font-size="10">the other K&#8722;1 actions send you back to s&#8320;</text>

  <line x1="20" y1="206" x2="620" y2="206" stroke="#30363d" stroke-width="1"/>

  <text x="20" y="230" fill="#f85149" font-size="11.5" font-weight="600">&#949;-greedy / entropy bonus</text>
  <text x="20" y="248" fill="#8b949e" font-size="10.5">re-randomises every step, so it must guess right</text>
  <text x="20" y="264" fill="#8b949e" font-size="10.5">N times running:</text>
  <text x="20" y="282" fill="#f85149" font-size="11.5">attempts &#8776; K&#8319;, exponential in chain length</text>

  <line x1="330" y1="212" x2="330" y2="292" stroke="#30363d" stroke-width="1"/>

  <text x="350" y="230" fill="#6c63ff" font-size="11.5" font-weight="600">directed exploration</text>
  <text x="350" y="248" fill="#8b949e" font-size="10.5">give unvisited states an uncertainty bonus, then let</text>
  <text x="350" y="264" fill="#8b949e" font-size="10.5">value backups carry it to their predecessors &#8212;</text>
  <text x="350" y="282" fill="#6c63ff" font-size="11.5">the agent is pulled forward on purpose</text>
</svg>
