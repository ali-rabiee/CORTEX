<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="ddt ddd" font-family="system-ui, -apple-system, sans-serif">
  <title id="ddt">The classical U-curve and what actually happens</title>
  <desc id="ddd">The textbook picture shows test error falling then rising as
    capacity grows, with an optimum in the middle. The observed behaviour for
    modern networks continues past that: test error peaks at the interpolation
    threshold, where the model has just enough capacity to fit the training data
    exactly, and then falls again as capacity grows further — often below the
    classical optimum. So "more parameters means more overfitting" is false in
    the regime where these models are actually trained.</desc>

  <line x1="60" y1="230" x2="600" y2="230" stroke="#484f58" stroke-width="1.2"/>
  <line x1="60" y1="230" x2="60" y2="50" stroke="#484f58" stroke-width="1.2"/>
  <text x="330" y="256" fill="#8b949e" font-size="11" text-anchor="middle">model capacity &#8594;</text>
  <text x="42" y="140" fill="#8b949e" font-size="11" transform="rotate(-90 42 140)" text-anchor="middle">test error</text>

  <!-- interpolation threshold -->
  <line x1="290" y1="50" x2="290" y2="230" stroke="#d29922" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="290" y="42" fill="#d29922" font-size="10.5" text-anchor="middle">interpolation threshold</text>
  <text x="290" y="272" fill="#8b949e" font-size="9.5" text-anchor="middle">exactly enough capacity to fit the training set</text>

  <!-- classical U -->
  <path d="M 70 96 C 120 190, 160 202, 200 196 C 232 190, 262 152, 290 100"
        fill="none" stroke="#8b949e" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="98" y="212" fill="#8b949e" font-size="10.5">classical U-curve</text>
  <circle cx="196" cy="197" r="4" fill="#8b949e"/>
  <text x="196" y="186" fill="#8b949e" font-size="9.5" text-anchor="middle">&#8220;optimum&#8221;</text>

  <!-- modern continuation -->
  <path d="M 70 96 C 120 190, 160 202, 200 196 C 232 190, 262 152, 290 76"
        fill="none" stroke="#6c63ff" stroke-width="2.6"/>
  <path d="M 290 76 C 330 132, 380 168, 440 180 C 500 190, 550 191, 594 190"
        fill="none" stroke="#6c63ff" stroke-width="2.6"/>
  <circle cx="290" cy="76" r="4.5" fill="#f85149"/>
  <text x="316" y="70" fill="#f85149" font-size="10.5">peak, not a plateau</text>

  <circle cx="560" cy="190.5" r="4" fill="#3fb950"/>
  <text x="560" y="178" fill="#3fb950" font-size="10" text-anchor="middle">often better than</text>
  <text x="560" y="167" fill="#3fb950" font-size="10" text-anchor="middle">the classical optimum</text>

  <text x="330" y="290" fill="#e6edf3" font-size="11" text-anchor="middle">&#8220;More parameters means more overfitting&#8221; describes the left third of this picture.</text>
</svg>
