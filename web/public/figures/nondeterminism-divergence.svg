<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>A single rounding difference reaches between-seed distance in about ninety steps</title>
  <desc>Weight-space distance between two runs that are identical except for a 1e-12 perturbation to one weight. In the amplifying regime the distance doubles every three steps and saturates at the distance between two different seeds by step 150. In the contracting regime it barely moves. Both runs still reach the same final accuracy, so metric reproducibility outlives weight reproducibility.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="20" y="26" fill="#e6edf3" font-size="13" font-weight="600">Distance between two runs that differ by one part in 10¹²</text>

  <line x1="82" y1="248" x2="500" y2="248" stroke="#30363d"/>
  <line x1="82" y1="60" x2="82" y2="248" stroke="#30363d"/>

  <text x="76" y="70" fill="#8b949e" font-size="8.5" text-anchor="end">10²</text>
  <text x="76" y="117" fill="#8b949e" font-size="8.5" text-anchor="end">10⁻²</text>
  <text x="76" y="164" fill="#8b949e" font-size="8.5" text-anchor="end">10⁻⁶</text>
  <text x="76" y="211" fill="#8b949e" font-size="8.5" text-anchor="end">10⁻¹⁰</text>
  <text x="76" y="248" fill="#8b949e" font-size="8.5" text-anchor="end">10⁻¹³</text>
  <text x="30" y="46" fill="#8b949e" font-size="9.5">‖ΔW‖</text>

  <line x1="82" y1="76" x2="500" y2="76" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="504" y="79" fill="#d29922" font-size="9.5">two different seeds: 32</text>

  <polyline points="82,241 117,206 152,171 187,136 222,101 257,79 292,77 327,76 362,76 397,76 432,76 467,76 500,76"
            fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="120" fill="#f85149" font-size="9.5">amplifying regime</text>
  <text x="150" y="133" fill="#f85149" font-size="9.5">(doubles every 3 steps)</text>

  <polyline points="82,241 152,239 222,238 292,238 362,238 432,237 500,237" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="256" y="232" fill="#3fb950" font-size="9.5">contracting regime: ×2.8 in 2000 steps</text>

  <line x1="187" y1="60" x2="187" y2="248" stroke="#484f58" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="192" y="264" fill="#8b949e" font-size="9">150</text>
  <text x="82" y="264" fill="#8b949e" font-size="9" text-anchor="middle">0</text>
  <text x="500" y="264" fill="#8b949e" font-size="9" text-anchor="middle">300</text>
  <text x="291" y="282" fill="#8b949e" font-size="9.5" text-anchor="middle">SGD steps</text>

  <rect x="512" y="96" width="112" height="126" rx="5" fill="#1c2128" stroke="#30363d"/>
  <text x="522" y="116" fill="#e6edf3" font-size="9.5" font-weight="600">one float32 ulp</text>
  <text x="522" y="131" fill="#8b949e" font-size="9">3 × 10⁻⁸ →</text>
  <text x="522" y="148" fill="#f85149" font-size="16" font-weight="600">89 steps</text>
  <text x="522" y="163" fill="#8b949e" font-size="9">to a different seed</text>
  <line x1="522" y1="176" x2="614" y2="176" stroke="#30363d"/>
  <text x="522" y="194" fill="#3fb950" font-size="9">final accuracy:</text>
  <text x="522" y="208" fill="#3fb950" font-size="9">1.000 both runs</text>
</svg>
