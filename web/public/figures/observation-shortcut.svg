<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>How a shortcut channel survives training and fails in closed loop</title>
  <desc>Left: during training the previous-action channel is supplied by the expert, so it is informative. During rollout it is supplied by the policy itself, forming a self-loop that carries no information about the goal. Right: as the causal channel gets noisier, training fit stays almost flat while closed-loop error rises by nearly three orders of magnitude.</desc>
  <rect width="640" height="300" fill="#0d1117"/>

  <text x="20" y="26" fill="#e6edf3" font-size="13" font-weight="600">The channel that is informative offline and empty online</text>
  <line x1="322" y1="42" x2="322" y2="282" stroke="#30363d" stroke-width="1"/>

  <!-- TRAINING -->
  <text x="20" y="58" fill="#3fb950" font-size="11" font-weight="600">TRAINING</text>
  <rect x="20" y="68" width="76" height="24" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="84" fill="#8b949e" font-size="10" text-anchor="middle">vision (noisy)</text>
  <rect x="20" y="100" width="76" height="24" rx="4" fill="#1c2128" stroke="#3fb950"/>
  <text x="58" y="116" fill="#3fb950" font-size="10" text-anchor="middle">a(t-1) expert</text>
  <path d="M96 80 L134 92" stroke="#484f58" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M96 112 L134 100" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
  <rect x="136" y="82" width="52" height="28" rx="4" fill="#1c2128" stroke="#6c63ff"/>
  <text x="162" y="100" fill="#6c63ff" font-size="10" text-anchor="middle">policy</text>
  <path d="M188 96 L222 96" stroke="#484f58" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="252" y="93" fill="#e6edf3" font-size="10" text-anchor="middle">loss vs</text>
  <text x="252" y="105" fill="#e6edf3" font-size="10" text-anchor="middle">expert a(t)</text>
  <text x="20" y="142" fill="#8b949e" font-size="9.5">a(t-1) is the expert's own smooth action:</text>
  <text x="20" y="155" fill="#8b949e" font-size="9.5">at 100 Hz it explains 94% of a(t) by itself.</text>

  <!-- ROLLOUT -->
  <text x="20" y="184" fill="#f85149" font-size="11" font-weight="600">ROLLOUT</text>
  <rect x="20" y="194" width="76" height="24" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="210" fill="#8b949e" font-size="10" text-anchor="middle">vision (noisy)</text>
  <path d="M96 206 L134 212" stroke="#484f58" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="136" y="200" width="52" height="28" rx="4" fill="#1c2128" stroke="#6c63ff"/>
  <text x="162" y="218" fill="#6c63ff" font-size="10" text-anchor="middle">policy</text>
  <path d="M188 214 L226 214" stroke="#484f58" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="248" y="217" fill="#e6edf3" font-size="10" text-anchor="middle">a(t)</text>
  <path d="M206 228 L206 250 L120 250 L120 220 L134 216" stroke="#f85149" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#b)"/>
  <text x="20" y="272" fill="#f85149" font-size="9.5">now fed by the policy itself: a self-loop with</text>
  <text x="20" y="285" fill="#f85149" font-size="9.5">no information about where the goal is.</text>

  <!-- PLOT -->
  <text x="352" y="58" fill="#e6edf3" font-size="11" font-weight="600">As the causal channel gets noisier</text>
  <line x1="352" y1="252" x2="622" y2="252" stroke="#30363d"/>
  <line x1="352" y1="72" x2="352" y2="252" stroke="#30363d"/>

  <polyline points="355,80 420,85 485,90 550,90 615,90" fill="none" stroke="#3fb950" stroke-width="2"/>
  <circle cx="355" cy="80" r="3" fill="#3fb950"/><circle cx="420" cy="85" r="3" fill="#3fb950"/>
  <circle cx="485" cy="90" r="3" fill="#3fb950"/><circle cx="550" cy="90" r="3" fill="#3fb950"/>
  <circle cx="615" cy="90" r="3" fill="#3fb950"/>
  <text x="418" y="74" fill="#3fb950" font-size="9.5">training fit  R² 0.999 → 0.941</text>

  <polyline points="355,250 420,192 485,162 550,124 615,82" fill="none" stroke="#f85149" stroke-width="2"/>
  <circle cx="355" cy="250" r="3" fill="#f85149"/><circle cx="420" cy="192" r="3" fill="#f85149"/>
  <circle cx="485" cy="162" r="3" fill="#f85149"/><circle cx="550" cy="124" r="3" fill="#f85149"/>
  <circle cx="615" cy="82" r="3" fill="#f85149"/>
  <text x="378" y="243" fill="#f85149" font-size="9.5">closed-loop error</text>
  <text x="378" y="255" fill="#f85149" font-size="9.5" opacity="0">.</text>
  <text x="622" y="100" fill="#f85149" font-size="9.5" text-anchor="end">37 cm</text>
  <text x="358" y="266" fill="#8b949e" font-size="9">0.5 cm</text>
  <text x="615" y="266" fill="#8b949e" font-size="9" text-anchor="middle">100 cm</text>
  <text x="487" y="280" fill="#8b949e" font-size="9.5" text-anchor="middle">noise on the vision channel</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#484f58"/></marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3fb950"/></marker>
    <marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#f85149"/></marker>
  </defs>
</svg>
