<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="vst vsd" font-family="system-ui, -apple-system, sans-serif">
  <title id="vst">What a VLM is reliable at, and what it is not</title>
  <desc id="vsd">The same scene asked two kinds of question. Naming and
    categorising objects — what is on the table, which one is the mug, which is
    fragile — is answered reliably. Metric and relational questions — how many
    centimetres apart, is the handle reachable, which is nearer the edge — are
    answered fluently and often wrongly, because the contrastive and captioning
    objectives that produced the model never required metric grounding.</desc>

  <!-- scene -->
  <rect x="24" y="52" width="216" height="152" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="132" y="38" fill="#8b949e" font-size="11" text-anchor="middle">one image</text>
  <rect x="48" y="168" width="168" height="10" rx="2" fill="#30363d"/>
  <circle cx="92" cy="146" r="20" fill="#30363d" stroke="#484f58"/>
  <text x="92" y="150" fill="#8b949e" font-size="9" text-anchor="middle">mug</text>
  <rect x="140" y="122" width="30" height="46" rx="4" fill="#30363d" stroke="#484f58"/>
  <text x="155" y="150" fill="#8b949e" font-size="9" text-anchor="middle">box</text>
  <circle cx="196" cy="152" r="14" fill="#30363d" stroke="#484f58"/>
  <text x="196" y="155" fill="#8b949e" font-size="8" text-anchor="middle">ball</text>

  <!-- reliable -->
  <rect x="272" y="44" width="344" height="98" rx="7" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="288" y="66" fill="#3fb950" font-size="11.5" font-weight="600">reliable &#8212; semantics and categories</text>
  <g fill="#8b949e" font-size="10.5">
    <text x="288" y="88">&#8220;what objects are on the table?&#8221;</text>
    <text x="288" y="106">&#8220;which one would break if dropped?&#8221;</text>
    <text x="288" y="124">&#8220;point to the thing you drink from&#8221;</text>
  </g>

  <!-- unreliable -->
  <rect x="272" y="156" width="344" height="112" rx="7" fill="#1c2128" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="288" y="178" fill="#f85149" font-size="11.5" font-weight="600">unreliable &#8212; metric and relational</text>
  <g fill="#8b949e" font-size="10.5">
    <text x="288" y="200">&#8220;how many centimetres apart are they?&#8221;</text>
    <text x="288" y="218">&#8220;is the mug closer to the edge than the box?&#8221;</text>
    <text x="288" y="236">&#8220;can the gripper reach behind the box?&#8221;</text>
  </g>
  <text x="288" y="258" fill="#f85149" font-size="10">answered fluently, and often wrongly</text>

  <line x1="248" y1="128" x2="266" y2="92" stroke="#3fb950" stroke-width="1.4"/>
  <line x1="248" y1="128" x2="266" y2="200" stroke="#f85149" stroke-width="1.4"/>

  <text x="320" y="290" fill="#8b949e" font-size="10.5" text-anchor="middle">Nothing in a contrastive or captioning objective ever required metric grounding &#8212; so it is not there.</text>
</svg>
