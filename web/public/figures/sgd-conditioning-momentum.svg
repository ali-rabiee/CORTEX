<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="sct2 scd2" font-family="system-ui, -apple-system, sans-serif">
  <title id="sct2">Why momentum helps: conditioning, not speed</title>
  <desc id="scd2">On an elongated quadratic bowl, plain gradient descent is
    limited by the steepest direction: any step large enough to make progress
    along the shallow axis oscillates across the narrow one. Momentum averages
    successive gradients, so the oscillating components cancel and the
    consistent component accumulates — turning a convergence rate proportional
    to the condition number into one proportional to its square root.</desc>

  <!-- elongated bowl contours -->
  <g fill="none" stroke="#30363d">
    <ellipse cx="180" cy="140" rx="130" ry="26"/>
    <ellipse cx="180" cy="140" rx="98" ry="19"/>
    <ellipse cx="180" cy="140" rx="66" ry="13"/>
    <ellipse cx="180" cy="140" rx="34" ry="7"/>
  </g>
  <circle cx="180" cy="140" r="3.5" fill="#3fb950"/>
  <text x="180" y="128" fill="#3fb950" font-size="9.5" text-anchor="middle">optimum</text>

  <!-- GD zigzag -->
  <path d="M 62 118 L 78 162 L 96 120 L 114 160 L 132 124 L 148 156 L 162 130 L 174 150"
        fill="none" stroke="#f85149" stroke-width="2"/>
  <circle cx="62" cy="118" r="3" fill="#f85149"/>
  <text x="52" y="106" fill="#f85149" font-size="10.5" text-anchor="start">gradient descent</text>
  <text x="52" y="196" fill="#8b949e" font-size="10">the step is limited by the steepest direction,</text>
  <text x="52" y="210" fill="#8b949e" font-size="10">so progress along the shallow one is slow</text>

  <!-- momentum path -->
  <path d="M 62 232 C 100 240, 140 238, 176 236" fill="none" stroke="#6c63ff" stroke-width="2.4"/>
  <circle cx="62" cy="232" r="3" fill="#6c63ff"/>
  <text x="52" y="256" fill="#6c63ff" font-size="10.5">with momentum: oscillations cancel, the consistent</text>
  <text x="52" y="270" fill="#6c63ff" font-size="10.5">component accumulates</text>

  <line x1="330" y1="20" x2="330" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- table -->
  <text x="352" y="34" fill="#e6edf3" font-size="12">iterations to a fixed error</text>
  <text x="352" y="50" fill="#8b949e" font-size="10">&#954; = ratio of largest to smallest curvature</text>

  <g font-size="10.5" fill="#8b949e">
    <text x="356" y="76">&#954;</text>
    <text x="424" y="76" fill="#f85149">GD ~ &#954;</text>
    <text x="510" y="76" fill="#6c63ff">momentum ~ &#8730;&#954;</text>
  </g>
  <line x1="352" y1="84" x2="612" y2="84" stroke="#30363d"/>

  <g font-size="10.5" fill="#e6edf3">
    <text x="356" y="106">10</text>      <text x="424" y="106">10</text>      <text x="510" y="106">3.2</text>
    <text x="356" y="130">100</text>     <text x="424" y="130">100</text>     <text x="510" y="130">10</text>
    <text x="356" y="154">1,000</text>   <text x="424" y="154">1,000</text>   <text x="510" y="154">32</text>
    <text x="356" y="178">10,000</text>  <text x="424" y="178">10,000</text>  <text x="510" y="178">100</text>
  </g>

  <text x="352" y="212" fill="#3fb950" font-size="10.5">momentum buys a factor of &#8730;&#954; &#8212; 100x at &#954;=10&#8308;</text>

  <rect x="352" y="226" width="260" height="46" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="482" y="246" fill="#e6edf3" font-size="10.5" text-anchor="middle">&#946;=0.9 averages ~10 gradients</text>
  <text x="482" y="262" fill="#8b949e" font-size="10" text-anchor="middle">effective step multiplier 1/(1&#8722;&#946;) = 10&#215;</text>
</svg>
