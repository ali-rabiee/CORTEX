<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="dpt dpd" font-family="system-ui, -apple-system, sans-serif">
  <title id="dpt">Iterative denoising of an action chunk, from two different seeds</title>
  <desc id="dpd">Each row starts from a different sample of pure Gaussian noise
    shaped like an action sequence. The same network is applied repeatedly to
    remove a little noise at a time. The two seeds converge to two different
    valid trajectories — one curving left, one curving right — instead of being
    averaged into a single straight path.</desc>

  <defs>
    <marker id="dparrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c63ff"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="90"  y="26" fill="#8b949e" font-size="11.5" text-anchor="middle">k = K</text>
  <text x="90"  y="40" fill="#484f58" font-size="10.5" text-anchor="middle">pure noise</text>
  <text x="250" y="26" fill="#8b949e" font-size="11.5" text-anchor="middle">k = 2</text>
  <text x="410" y="26" fill="#8b949e" font-size="11.5" text-anchor="middle">k = 1</text>
  <text x="570" y="26" fill="#e6edf3" font-size="11.5" text-anchor="middle" font-weight="600">k = 0</text>
  <text x="570" y="40" fill="#484f58" font-size="10.5" text-anchor="middle">executable chunk</text>

  <!-- ============ row 1: seed A ============ -->
  <text x="16" y="105" fill="#8b949e" font-size="11" transform="rotate(-90 16 105)" text-anchor="middle">seed A</text>

  <rect x="30"  y="52" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 40 74 L 50 130 L 60 66 L 70 126 L 80 72 L 90 136 L 100 78 L 110 120 L 120 64 L 130 132 L 140 84"
        fill="none" stroke="#484f58" stroke-width="1.8"/>

  <rect x="190" y="52" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 200 128 L 214 96 L 228 116 L 242 82 L 256 100 L 270 72 L 284 88 L 300 66"
        fill="none" stroke="#8b949e" stroke-width="1.8"/>

  <rect x="350" y="52" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 360 130 C 384 126, 396 96, 412 84 C 428 72, 444 70, 460 66"
        fill="none" stroke="#a9b3bf" stroke-width="2"/>

  <rect x="510" y="52" width="120" height="96" rx="6" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.5"/>
  <path d="M 520 132 C 546 130, 560 96, 578 80 C 594 68, 608 64, 620 62"
        fill="none" stroke="#3fb950" stroke-width="2.4"/>

  <line x1="154" y1="100" x2="184" y2="100" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>
  <line x1="314" y1="100" x2="344" y2="100" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>
  <line x1="474" y1="100" x2="504" y2="100" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>

  <!-- ============ row 2: seed B ============ -->
  <text x="16" y="235" fill="#8b949e" font-size="11" transform="rotate(-90 16 235)" text-anchor="middle">seed B</text>

  <rect x="30"  y="182" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 40 258 L 50 200 L 60 264 L 70 206 L 80 252 L 90 196 L 100 262 L 110 210 L 120 256 L 130 198 L 140 250"
        fill="none" stroke="#484f58" stroke-width="1.8"/>

  <rect x="190" y="182" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 200 202 L 214 232 L 228 214 L 242 244 L 256 228 L 270 254 L 284 240 L 300 262"
        fill="none" stroke="#8b949e" stroke-width="1.8"/>

  <rect x="350" y="182" width="120" height="96" rx="6" fill="#1c2128" stroke="#30363d"/>
  <path d="M 360 200 C 384 204, 396 234, 412 246 C 428 258, 444 260, 460 264"
        fill="none" stroke="#a9b3bf" stroke-width="2"/>

  <rect x="510" y="182" width="120" height="96" rx="6" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.5"/>
  <path d="M 520 198 C 546 200, 560 234, 578 250 C 594 262, 608 266, 620 268"
        fill="none" stroke="#3fb950" stroke-width="2.4"/>

  <line x1="154" y1="230" x2="184" y2="230" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>
  <line x1="314" y1="230" x2="344" y2="230" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>
  <line x1="474" y1="230" x2="504" y2="230" stroke="#6c63ff" stroke-width="1.6" marker-end="url(#dparrow)"/>

  <text x="320" y="166" fill="#6c63ff" font-size="11.5" text-anchor="middle">same network, applied K times: a &#8592; a &#8722; step &#183; &#949;&#952;(a, k, o)</text>
</svg>
