<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="system-ui, -apple-system, sans-serif">
  <title>Linear conditional paths do not give straight marginal trajectories</title>
  <desc>Left: with an independent coupling the straight conditional paths cross, so the marginal ODE trajectory curves — measured deviation from its own chord is 21 percent of the total displacement. After reflow the paired paths no longer cross and the trajectory is straight. Right: Wasserstein error against network evaluations. Linear interpolation is worse than the diffusion path at every budget; the rectified coupling sits at the sampling-noise floor after a single step.</desc>
  <rect width="640" height="300" fill="#0d1117"/>
  <line x1="342" y1="40" x2="342" y2="284" stroke="#30363d"/>

  <text x="20" y="24" fill="#e6edf3" font-size="12" font-weight="600">Straight conditional paths, curved marginal path</text>

  <text x="20" y="52" fill="#8b949e" font-size="9.5">independent coupling — the paths cross</text>
  <line x1="46" y1="64" x2="46" y2="140" stroke="#30363d" stroke-width="2"/>
  <line x1="300" y1="64" x2="300" y2="140" stroke="#30363d" stroke-width="2"/>
  <text x="46" y="152" fill="#8b949e" font-size="8.5" text-anchor="middle">noise</text>
  <text x="300" y="152" fill="#8b949e" font-size="8.5" text-anchor="middle">data</text>
  <line x1="46" y1="72" x2="300" y2="128" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="90" x2="300" y2="70" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="108" x2="300" y2="132" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="130" x2="300" y2="86" stroke="#484f58" stroke-width="1"/>
  <path d="M46 100 C 110 74, 190 126, 300 100" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="120" y="118" fill="#f85149" font-size="9">marginal trajectory: 21% off its chord</text>

  <text x="20" y="186" fill="#8b949e" font-size="9.5">after reflow — pair each start with its own endpoint</text>
  <line x1="46" y1="198" x2="46" y2="258" stroke="#30363d" stroke-width="2"/>
  <line x1="300" y1="198" x2="300" y2="258" stroke="#30363d" stroke-width="2"/>
  <line x1="46" y1="204" x2="300" y2="206" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="220" x2="300" y2="224" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="238" x2="300" y2="240" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="252" x2="300" y2="254" stroke="#484f58" stroke-width="1"/>
  <line x1="46" y1="228" x2="300" y2="231" stroke="#3fb950" stroke-width="2.5"/>
  <text x="110" y="276" fill="#3fb950" font-size="9">straight — one Euler step is exact</text>

  <text x="362" y="24" fill="#e6edf3" font-size="12" font-weight="600">W₁ error vs. evaluations</text>
  <line x1="380" y1="252" x2="620" y2="252" stroke="#30363d"/>
  <line x1="380" y1="62" x2="380" y2="252" stroke="#30363d"/>
  <text x="374" y="73" fill="#8b949e" font-size="8.5" text-anchor="end">2</text>
  <text x="374" y="167" fill="#8b949e" font-size="8.5" text-anchor="end">0.05</text>
  <text x="374" y="249" fill="#8b949e" font-size="8.5" text-anchor="end">0.003</text>

  <polyline points="380,70 428,102 476,129 524,148 572,167 620,186" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="470" y="122" fill="#d29922" font-size="9">linear interp</text>
  <polyline points="380,84 428,123 476,167 524,190 572,207 620,222" fill="none" stroke="#6c63ff" stroke-width="2"/>
  <text x="520" y="212" fill="#6c63ff" font-size="9" text-anchor="end">diffusion</text>
  <line x1="380" y1="246" x2="620" y2="246" stroke="#3fb950" stroke-width="2.5"/>
  <circle cx="380" cy="246" r="4" fill="#3fb950"/>
  <text x="392" y="240" fill="#3fb950" font-size="9">rectified — at the floor in 1 step</text>

  <text x="380" y="266" fill="#8b949e" font-size="9" text-anchor="middle">1</text>
  <text x="476" y="266" fill="#8b949e" font-size="9" text-anchor="middle">4</text>
  <text x="572" y="266" fill="#8b949e" font-size="9" text-anchor="middle">16</text>
  <text x="500" y="284" fill="#8b949e" font-size="9.5" text-anchor="middle">network function evaluations</text>
</svg>
