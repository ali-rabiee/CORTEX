<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="pct pcd" font-family="system-ui, -apple-system, sans-serif">
  <title id="pct">The PPO clipped objective as a function of the probability ratio</title>
  <desc id="pcd">Two plots of the clipped surrogate against the probability
    ratio r. When the advantage is positive the objective rises with r and then
    goes flat above one plus epsilon, so there is no further incentive to
    increase the action's probability. When the advantage is negative the
    objective is flat below one minus epsilon and slopes away above it, so the
    gradient stays alive in the direction that pulls a bad update back.</desc>

  <!-- ===== LEFT: A > 0 ===== -->
  <text x="30" y="26" fill="#3fb950" font-size="12.5" font-weight="600">advantage A &#62; 0</text>
  <text x="30" y="44" fill="#8b949e" font-size="11">this action was better than average</text>

  <line x1="50" y1="240" x2="290" y2="240" stroke="#484f58" stroke-width="1.2"/>
  <line x1="50" y1="240" x2="50" y2="80" stroke="#484f58" stroke-width="1.2"/>
  <text x="296" y="244" fill="#8b949e" font-size="10.5">r</text>
  <text x="42" y="74" fill="#8b949e" font-size="10.5" text-anchor="end">L</text>

  <line x1="130" y1="80" x2="130" y2="245" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="230" y1="80" x2="230" y2="245" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="130" y="260" fill="#8b949e" font-size="10" text-anchor="middle">1</text>
  <text x="230" y="260" fill="#8b949e" font-size="10" text-anchor="middle">1+&#949;</text>

  <path d="M 60 232 L 230 130" stroke="#3fb950" stroke-width="2.6" fill="none"/>
  <path d="M 230 130 L 288 130" stroke="#3fb950" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/>
  <circle cx="230" cy="130" r="4" fill="#3fb950"/>

  <text x="146" y="196" fill="#3fb950" font-size="10.5">gradient active</text>
  <text x="238" y="116" fill="#d29922" font-size="10.5">flat &#8212; no gradient</text>
  <text x="238" y="102" fill="#8b949e" font-size="10">you have moved far enough</text>

  <line x1="320" y1="20" x2="320" y2="284" stroke="#30363d" stroke-width="1"/>

  <!-- ===== RIGHT: A < 0 ===== -->
  <text x="350" y="26" fill="#f85149" font-size="12.5" font-weight="600">advantage A &#60; 0</text>
  <text x="350" y="44" fill="#8b949e" font-size="11">this action was worse than average</text>

  <line x1="370" y1="110" x2="610" y2="110" stroke="#484f58" stroke-width="1.2"/>
  <line x1="370" y1="110" x2="370" y2="250" stroke="#484f58" stroke-width="1.2"/>
  <text x="616" y="114" fill="#8b949e" font-size="10.5">r</text>
  <text x="362" y="252" fill="#8b949e" font-size="10.5" text-anchor="end">L</text>

  <line x1="420" y1="105" x2="420" y2="252" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="105" x2="490" y2="252" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="420" y="96" fill="#8b949e" font-size="10" text-anchor="middle">1&#8722;&#949;</text>
  <text x="490" y="96" fill="#8b949e" font-size="10" text-anchor="middle">1</text>

  <path d="M 378 152 L 420 152" stroke="#d29922" stroke-width="2.6" fill="none" stroke-dasharray="7 4"/>
  <circle cx="420" cy="152" r="4" fill="#f85149"/>
  <path d="M 420 152 L 600 244" stroke="#f85149" stroke-width="2.6" fill="none"/>

  <text x="376" y="140" fill="#d29922" font-size="10.5">flat</text>
  <text x="510" y="196" fill="#f85149" font-size="10.5">gradient stays active here</text>
  <text x="510" y="212" fill="#8b949e" font-size="10">so a bad update can be undone</text>

  <text x="320" y="288" fill="#e6edf3" font-size="11.5" text-anchor="middle">The min of the clipped and unclipped terms is what keeps the right-hand slope. The ratio itself is never constrained.</text>
</svg>
