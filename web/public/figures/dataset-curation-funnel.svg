<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="dct dcd" font-family="system-ui, -apple-system, sans-serif">
  <title id="dct">The curation funnel, and the feedback loop that decides what to collect next</title>
  <desc id="dcd">Raw collected demonstrations pass through filters for success,
    operator quality, and near-duplicate removal, leaving a much smaller training
    set. A coverage analysis of what survives feeds back into the collection
    plan, so the next session targets the gaps rather than adding more of what is
    already well covered.</desc>

  <defs>
    <marker id="dcf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
    <marker id="dcb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  </defs>

  <!-- funnel stages -->
  <g stroke="#30363d" fill="#1c2128">
    <rect x="24"  y="70" width="104" height="86" rx="6"/>
    <rect x="164" y="80" width="104" height="66" rx="6"/>
    <rect x="304" y="88" width="104" height="50" rx="6"/>
    <rect x="444" y="94" width="104" height="38" rx="6" stroke="#3fb950" stroke-opacity="0.6"/>
  </g>
  <g fill="#e6edf3" font-size="10.5" text-anchor="middle">
    <text x="76"  y="108">raw episodes</text>
    <text x="216" y="110">success only</text>
    <text x="356" y="110">quality filter</text>
    <text x="496" y="110">deduplicated</text>
  </g>
  <g fill="#8b949e" font-size="9.5" text-anchor="middle">
    <text x="76"  y="126">everything logged</text>
    <text x="216" y="126">drop failures*</text>
    <text x="356" y="126">drop weak operators</text>
    <text x="496" y="126">training set</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.4" marker-end="url(#dcf)">
    <line x1="132" y1="113" x2="158" y2="113"/>
    <line x1="272" y1="113" x2="298" y2="113"/>
    <line x1="412" y1="113" x2="438" y2="113"/>
  </g>

  <text x="76"  y="60" fill="#8b949e" font-size="10" text-anchor="middle">2,400</text>
  <text x="216" y="60" fill="#8b949e" font-size="10" text-anchor="middle">1,700</text>
  <text x="356" y="60" fill="#8b949e" font-size="10" text-anchor="middle">1,100</text>
  <text x="496" y="60" fill="#3fb950" font-size="10" text-anchor="middle">950</text>

  <text x="24" y="182" fill="#f85149" font-size="10">* keep the failures &#8212; they are useless for cloning and valuable for a critic, so archive rather than delete</text>

  <!-- feedback loop -->
  <rect x="200" y="204" width="240" height="40" rx="7" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="320" y="222" fill="#3fb950" font-size="11" text-anchor="middle">coverage analysis of what survived</text>
  <text x="320" y="237" fill="#8b949e" font-size="9.5" text-anchor="middle">which objects, poses, lightings are thin?</text>

  <path d="M 496 136 L 496 224 L 446 224" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#dcb)"/>
  <path d="M 196 224 L 76 224 L 76 162" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#dcb)"/>

  <text x="320" y="272" fill="#e6edf3" font-size="11" text-anchor="middle">The output of curation is not just a dataset &#8212; it is a collection plan.</text>
  <text x="320" y="288" fill="#8b949e" font-size="10.5" text-anchor="middle">More of what you already cover is the cheapest thing to collect and the least useful.</text>
</svg>
