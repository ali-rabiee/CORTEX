domain: robot_learning
questions:
  - id: robot_q1
    question: "A robot policy trained in simulation achieves 95% success but drops
      to 30% on the real robot. The most likely cause is:"
    options:
      - Insufficient training steps in simulation
      - Reality gap — sim physics/rendering doesn't match real world
      - The reward function is too sparse
      - The policy architecture is too small
    correct_answer: 1
    explanation: "The large sim-to-real performance gap (95% → 30%) is the classic
      reality gap problem. The policy overfit to simulation-specific dynamics
      (friction, contact models, visual appearance) that don't transfer.
      Solutions: domain randomization, system identification, or real-world
      fine-tuning."
    concept_ids:
      - sim2real_transfer
      - domain_randomization
    difficulty: 2
    tags:
      - robot_learning
  - id: robot_q2
    question: "In behavior cloning, compounding errors occur because:"
    options:
      - The expert demonstrations are noisy
      - Small prediction errors push the policy into states not covered by
        demonstrations
      - The loss function doesn't penalize large errors enough
      - The model memorizes demonstrations instead of generalizing
    correct_answer: 1
    explanation: Compounding errors (covariate shift) is the fundamental challenge
      of BC. A small prediction error at timestep t causes the policy to drift
      into a state distribution not seen in demonstrations. At timestep t+1, the
      policy is in an unfamiliar state, makes a larger error, drifts further,
      and errors cascade. DAgger addresses this by collecting expert corrections
      in the policy's own state distribution.
    concept_ids:
      - behavior_cloning
    difficulty: 2
    tags:
      - robot_learning
  - id: robot_q3
    question: "Domain randomization with too wide a parameter range typically causes:"
    options:
      - The policy fails to converge during training
      - The policy becomes overly conservative, performing worst-case behavior
      - The simulation becomes unstable
      - The policy only works in simulation
    correct_answer: 1
    explanation: When randomization ranges are too wide, the policy must handle
      extremely diverse conditions including adversarial combinations. It learns
      the safest, most conservative behavior that works across all conditions —
      which may be too cautious for the real world. The fix is ADR (Automatic
      Domain Randomization) that expands ranges based on performance.
    concept_ids:
      - domain_randomization
      - sim2real_transfer
    difficulty: 3
    tags:
      - robot_learning
  - id: robot_q4
    question: "Action chunking (predicting K future actions at once) primarily helps
      behavior cloning by:"
    options:
      - Reducing computational cost
      - Reducing the effective decision horizon, which mitigates compounding
        errors
      - Making the policy smoother
      - Enabling parallel execution on the robot
    correct_answer: 1
    explanation: Action chunking reduces the number of independent decisions the
      policy makes over a trajectory. With K=100, a 1000-step task only requires
      10 decisions instead of 1000. Fewer decisions = fewer opportunities for
      errors to compound. Smoother trajectories are a benefit but not the
      primary mechanism — it's the horizon reduction that addresses BC's core
      weakness.
    concept_ids:
      - action_chunking
      - behavior_cloning
    difficulty: 3
    tags:
      - robot_learning
  - id: robot_q5
    question: "Using a pre-trained visual encoder (e.g., R3M, DINOv2) instead of
      training from scratch for visuomotor policies primarily helps with:"
    options:
      - Inference speed
      - Sample efficiency — needing far fewer demonstrations
      - Handling dynamic environments
      - Multi-task generalization
    correct_answer: 1
    explanation: "Pre-trained visual encoders have already learned useful visual
      features from large-scale data. For manipulation, this means the policy
      only needs to learn the mapping from features to actions, not how to
      process raw pixels. In practice, this reduces demonstration requirements
      by 5-10x: from hundreds to tens of demonstrations."
    concept_ids:
      - visuomotor_policy
      - representation_learning
    difficulty: 2
    tags:
      - robot_learning
      - perception
  - id: robot_q6
    question: "DAgger improves over pure behavior cloning by:"
    options:
      - Using a larger neural network
      - Collecting expert corrections at states visited by the learner's own
        policy
      - Training with a different loss function
      - Adding noise to the expert demonstrations
    correct_answer: 1
    explanation: "DAgger (Dataset Aggregation) iteratively runs the current policy,
      then queries the expert for what action it would take at the states the
      learner visited. This directly addresses covariate shift: the training
      data now covers the learner's actual state distribution, not just the
      expert's. The error bound improves from O(T²ε) to O(Tε)."
    concept_ids:
      - dagger
      - behavior_cloning
    difficulty: 2
    tags:
      - robot_learning
  - id: robot_q7
    question: "In imitation learning, inverse RL differs from behavior cloning by:"
    options:
      - Using more data
      - Recovering a reward function from demonstrations instead of directly
        copying actions
      - Training faster
      - Not requiring expert demonstrations
    correct_answer: 1
    explanation: "BC directly mimics state→action mappings. IRL solves a harder
      problem: infer what reward function R(s,a) the expert is optimizing, then
      find a policy that optimizes that reward. The recovered reward can
      transfer to new environments and is more robust to distribution shift. The
      cost: IRL requires solving an RL problem in an inner loop, making it much
      more computationally expensive."
    concept_ids:
      - imitation_learning
      - behavior_cloning
    difficulty: 3
    tags:
      - robot_learning
  - id: robot_q8
    question: "Contact-rich manipulation (e.g., peg insertion) is fundamentally
      harder to learn than pick-and-place because:"
    options:
      - It requires more training data
      - Contact dynamics are discontinuous and poorly modeled by standard
        simulators
      - The action space is larger
      - It needs higher camera resolution
    correct_answer: 1
    explanation: "Contact transitions involve discontinuous dynamics: a peg either
      slides, sticks, or jams depending on tiny force/position differences.
      Simulators use soft contact approximations that diverge from real rigid
      contact, making the sim2real gap much larger for contact-rich tasks. This
      is why impedance control + tactile feedback + real-world fine-tuning are
      essential for these tasks."
    concept_ids:
      - contact_rich_manipulation
      - sim2real_transfer
    difficulty: 3
    tags:
      - robot_learning
  - id: robot_q9
    question: "The ALOHA teleoperation setup uses leader-follower robot arms rather
      than VR controllers because:"
    options:
      - It's cheaper to build
      - The kinematic matching produces more natural demonstrations since the
        operator controls the same morphology as the robot
      - It allows wireless operation
      - It supports higher control frequencies
    correct_answer: 1
    explanation: ALOHA uses identical robot arms as leader and follower. Since the
      operator directly moves a robot arm, the recorded joint trajectories are
      kinematically consistent with the robot's workspace, joint limits, and
      dynamics. VR controllers map a different morphology (human hand) to the
      robot, which can produce demonstrations with actions the robot can't
      smoothly execute.
    concept_ids:
      - teleoperation
      - behavior_cloning
    difficulty: 2
    tags:
      - robot_learning
  - id: robot_q10
    question: "Language-conditioned policies π(a|s, Enc(l)) enable generalization to
      new tasks primarily through:"
    options:
      - Training on more data
      - Compositionality — combining known concepts (objects, actions, spatial
        relations) in novel ways
      - Using larger networks
      - Faster inference
    correct_answer: 1
    explanation: The language encoder maps instructions into a shared embedding
      space where 'pick up the red cup' and 'pick up the blue bowl' share
      structure. If the policy has learned 'pick up' + color grounding + object
      recognition, it can compose these for novel combinations like 'place the
      green bottle on the shelf' without having seen that exact instruction
      during training.
    concept_ids:
      - multi_task_policy
      - language_grounding
    difficulty: 3
    tags:
      - robot_learning
      - foundation_models
  - id: robot_q11
    question: "For grasp planning on novel objects, learned methods (e.g.,
      Contact-GraspNet) are preferred over analytical force closure methods
      because:"
    options:
      - They are more mathematically rigorous
      - They generalize to novel geometries from partial observations without
        requiring exact object models
      - They guarantee stable grasps
      - They are faster to compute
    correct_answer: 1
    explanation: Analytical methods require a complete 3D model and exact contact
      surface properties to verify force closure conditions. Learned methods
      predict grasp poses directly from partial point clouds, handling novel
      objects not seen during training. In practice, real-world perception only
      provides partial observations (occluded surfaces), making model-free
      learned methods far more practical for bin picking and general
      manipulation.
    concept_ids:
      - grasp_planning
      - point_cloud_processing
    difficulty: 2
    tags:
      - robot_learning
      - perception
  - id: robot_q12
    question: "RRT (Rapidly-exploring Random Tree) motion planning is
      probabilistically complete, which means:"
    options:
      - It always finds the shortest path
      - Given infinite time, it will find a path if one exists, but may not find
        it in finite time
      - It finds a solution in polynomial time
      - It explores the entire configuration space
    correct_answer: 1
    explanation: Probabilistic completeness means the probability of finding a
      solution (if one exists) approaches 1 as the number of samples approaches
      infinity. In practice, RRT-Connect finds solutions quickly for most
      problems but can struggle with narrow passages where the probability of
      sampling a valid configuration is very low. RRT* adds asymptotic
      optimality — converging to the shortest path given enough time.
    concept_ids:
      - motion_planning
    difficulty: 2
    tags:
      - robot_learning
      - systems
