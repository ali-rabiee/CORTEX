id: experiment_tracking
title: Experiment Tracking and Reproducibility
domain: systems
summary: A run is only a measurement if you can say what it measured. Attribution
  needs exactly one thing to differ — and bit-level reproducibility is lost within
  about ninety steps, which changes what "reproducible" can mean.
