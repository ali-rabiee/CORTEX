id: action_generation
title: Action Generation with Generative Models
domain: generative_control
summary: >-
  Generating a chunk means modelling a joint distribution over time, and getting
  every per-step marginal right is worth nothing — coherence fails as 2^(1-H), so
  chunking is what turns a generative head from optional into necessary.
