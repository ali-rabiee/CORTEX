id: flow_matching
title: Flow Matching for Action Generation
domain: generative_control
summary: Learn a velocity field instead of a score, trained without ever
  simulating the path. The often-repeated claim that this gives straight
  trajectories is false as stated — straightening requires fixing the coupling,
  and that is where one-step generation actually comes from.
