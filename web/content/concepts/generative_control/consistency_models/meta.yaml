id: consistency_models
title: Consistency Models for Single-Step Action Generation
domain: generative_control
summary: Learn the map from any point on a trajectory straight to its endpoint,
  instead of integrating. Self-consistency alone is vacuous — a constant function
  satisfies it exactly — so the boundary condition carries the whole objective.
