id: multimodal_distributions
title: Multi-Modal Action Distributions
domain: generative_control
summary: >-
  When several actions are correct, a regression head predicts their average — an
  action with no expert support at all. The fixes are subtler than they look; L1
  does not help, and per-dimension bins get every marginal right while inventing
  half their joint mass.
