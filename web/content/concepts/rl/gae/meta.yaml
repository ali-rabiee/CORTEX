id: gae
title: Generalized Advantage Estimation (GAE) — Formal Treatment
domain: rl
summary: GAE is a knob ($\lambda$) that lets you smoothly trade off between
  trusting your value function (low $\lambda$, more bias, less variance) and
  trusting actual observed rewards (high $\lambda$, less bias, more variance).
