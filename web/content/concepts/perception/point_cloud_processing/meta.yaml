id: point_cloud_processing
title: Point Cloud Processing
domain: perception
summary: >-
  A point cloud is a set, so the network must be permutation invariant — and the
  standard way to achieve that, max-pooling, means a measured 9% of the points
  determine the output exactly. Robustness and blindness are the same property.
