id: pose_estimation_6d
title: 6D Object Pose Estimation
domain: perception
summary: >-
  Most of the difficulty is in the output space, not the perception. Rotation
  representations below five dimensions are discontinuous and produce near-180°
  failures, and object symmetry makes a correct pose score worse than a wrong one.
