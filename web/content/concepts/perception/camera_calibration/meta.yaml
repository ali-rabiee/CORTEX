id: camera_calibration
title: Camera Calibration and Hand-Eye Calibration
domain: perception
summary: >-
  Reprojection error is computed on the data that produced the calibration, so it
  cannot see a degeneracy — a fronto-parallel capture gives 0.18 px RMS and a
  focal length wrong by a factor of seven.
